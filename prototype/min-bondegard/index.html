}
const M4 = (x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, sx = 1, sy = sx, sz = sx) => new THREE.Matrix4().compose(new THREE.Vector3(x, y, z), new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, ry, rz)), new THREE.Vector3(sx, sy, sz));

  t.anisotropy = renderer.capabilities.getMaxAnisotropy(); if (farge) t.encoding = THREE.sRGBEncoding; return t;

const TEX = {};
function lagTeksturer() {
  const planker = (base, fuge) => lerret(512, 512, (x, w, h) => {
    const n = 8, bw = w / n;
    for (let i = 0; i < n; i++) {

      x.globalAlpha = 0.18; x.fillStyle = '#fff'; x.fillRect(i * bw + 2, 0, 3, h);
      x.globalAlpha = 0.5; x.fillStyle = '#000'; [24, h - 24].forEach(y => { x.beginPath(); x.arc(i * bw + bw / 2, y, 2.2, 0, 7); x.fill(); });
      if (rnd() < 0.4) { x.globalAlpha = 0.22; x.beginPath(); x.ellipse(i * bw + rr(12, bw - 12), rr(60, h - 60), 5, 9, 0, 0, 7); x.fill(); }
      x.globalAlpha = 1; x.fillStyle = fuge; x.fillRect(i * bw, 0, 3, h);
    }
  });
  const takstein = (base) => lerret(512, 512, (x, w, h) => {
    const rader = 8, sw = w / 8, sh = h / rader;
    x.fillStyle = '#2a1e1a'; x.fillRect(0, 0, w, h);
    for (let r = 0; r < rader; r++) for (let i = -1; i < 9; i++) {
      const ox = i * sw + (r % 2 ? sw / 2 : 0), oy = r * sh;
      const c = new THREE.Color(base); c.offsetHSL((rnd() - 0.5) * 0.02, (rnd() - 0.5) * 0.1, (rnd() - 0.5) * 0.08);
      const g = x.createLinearGradient(0, oy, 0, oy + sh * 1.15);
      g.addColorStop(0, '#' + c.clone().multiplyScalar(0.62).getHexString()); g.addColorStop(0.75, '#' + c.getHexString()); g.addColorStop(1, '#' + c.clone().offsetHSL(0, 0, 0.06).getHexString());

    x.fillStyle = '#6e4a2c'; x.fillRect(0, 0, w, h);

  });

  const hoy = lerret(256, 256, (x, w, h) => { x.fillStyle = '#d9b75c'; x.fillRect(0, 0, w, h);

/* ======================= Terreng ======================= */
const VEI_Z = 12.5;
function elvZ(x) { return -25 + Math.sin(x * 0.06) * 5 + Math.sin(x * 0.17) * 1.2; }

let VANN = null;

  mesh(teksturUV(avrundetBoks(2.2, 0.1, 0.62, 0.03, 1), 1, 0.3), MAT.lysPlank, 0, 0.58, 0, benk); mesh(teksturUV(avrundetBoks(2.2, 0.45, 0.08, 0.03, 1), 1, 0.25), MAT.lysPlank, 0, 0.95, -0.3, benk);
  [-0.9, 0.9].forEach(x => mesh(avrundetBoks(0.12, 0.6, 0.55, 0.03, 1), MAT.brunPlank, x, 0.3, 0, benk)); bake(benk);

  mesh(avrundetBoks(0.4, 0.38, 0.65, 0.15, 3), std({color: SRGB(0xd23b2f), roughness: 0.5}), 0, 1.25, 0, pk); mesh(new THREE.BoxGeometry(0.04, 0.25, 0.08), std({color: SRGB(0xf2c23b)}), 0.22, 1.35, -0.15, pk);
}

/* ======================= Lys, tid og vær ======================= */
let TID = 'dag';
const TIDER = {
  dag:   {himmel: 0x8fcaf0, horisont: 0xd9eef8, sol: 0xfff0d0, solI: 2.4, hemi: 0.72, hemiT: 0xdff1ff, lykt: 0, glass: 0, regn: false, eksp: 0.98, pos: [-26, 40, 22]},
  kveld: {himmel: 0xe48f6a, horisont: 0xf4bf96, sol: 0xff9a5c, solI: 1.35, hemi: 0.7, hemiT: 0xffc9a8, lykt: 2.6, glass: 1.8, regn: false, eksp: 0.92, pos: [-40, 16, 18]},
  regn:  {himmel: 0x8696a6, horisont: 0xa9b6c0, sol: 0xdfe5ec, solI: 0.75, hemi: 0.85, hemiT: 0xc4d0db, lykt: 0, glass: 0.4, regn: true, eksp: 0.88, pos: [-20, 40, 10]},
};
let regn = null, regnbue = null;
function himmel(farge, hor) { const c = document.createElement('canvas'); c.width = 4; c.height = 256; const x = c.getContext('2d'); const g = x.createLinearGradient(0, 0, 0, 256); g.addColorStop(0, '#' + new THREE.Color(farge).getHexString()); g.addColorStop(1, '#' + new THREE.Color(hor).getHexString()); x.fillStyle = g; x.fillRect(0, 0, 4, 256); const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t; }
function settTid(t) {

function lagVaer() {

  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(rp, 3));

  regnbue.position.set(10, -3, -70); regnbue.visible = false; scene.add(regnbue);
}

/* ======================= Roboten ======================= */
let robot = null, mixer = null, klipp = {}, aktiv = null, hode = null, hatt = null, hattOffset = 0, modus = 'vent', mal = null, ventTimer = 2, ventSteg = 0, ventI = 0;
function lagHatt() {
  const g = new THREE.Group(); const strå = std({map: TEX.hoy, color: SRGB(0xf6dc8a), roughness: 0.95});
  mesh(new THREE.CylinderGeometry(0.62, 0.68, 0.05, 28), strå, 0, 0, 0, g); mesh(new THREE.CylinderGeometry(0.3, 0.36, 0.34, 24), strå, 0, 0.18, 0, g);
  mesh(new THREE.CylinderGeometry(0.365, 0.365, 0.09, 24), std({color: SRGB(0xc0392b)}), 0, 0.06, 0, g); return g;
}
function spill(navn, loop = true, fade = 0.25) { if (!klipp[navn]) navn = 'Idle'; const a = mixer.clipAction(klipp[navn]); a.reset(); a.setLoop(loop ? THREE.LoopRepeat : THREE.LoopOnce); a.clampWhenFinished = !loop; if (aktiv && aktiv !== a) aktiv.fadeOut(fade); a.fadeIn(fade).play(); aktiv = a; }
const VENT = [
  {pos: () => new THREE.Vector3(6.2, 0, 0.7), anim: 'Yes', tid: 3.5, se: () => hoener[1].position},
  {pos: () => new THREE.Vector3(-3.2, 0, 6.6), anim: 'Sitting', tid: 5, benk: true},
  {pos: () => new THREE.Vector3(2.4, 0, 0.6), anim: 'ThumbsUp', tid: 2.5, se: () => new THREE.Vector3(2.4, 0, 3)},

function gaaTil(p, ferdig) { mal = {p, ferdig}; spill('Walking'); }
function nesteVent() { const v = VENT[ventI++ % VENT.length]; gaaTil(v.pos(), () => {
  if (v.benk) { robot.rotation.y = 0; robot.position.set(-3.2, 0.05, 6.75); } else if (v.se) { const s = v.se(); robot.rotation.y = Math.atan2(s.x - robot.position.x, s.z - robot.position.z); }
  spill(v.anim); ventTimer = v.tid; ventSteg = 2; }); ventSteg = 1; }
const konfetti = (() => { const n = 300, im = new THREE.InstancedMesh(new THREE.PlaneGeometry(0.16, 0.09), new THREE.MeshBasicMaterial({side: THREE.DoubleSide}), n); const c = new THREE.Color(); const data = [];
  for (let i = 0; i < n; i++) { c.set([0xff4d6d, 0xffd23f, 0x3bceac, 0x4d96ff, 0xff8c42][i % 5]); im.setColorAt(i, c); data.push({p: new THREE.Vector3(), v: new THREE.Vector3(), r: new THREE.Euler(), w: Math.random() * 7}); }
  im.visible = false; im.frustumCulled = false; scene.add(im); return {im, data, t: 0}; })();
function nyttNivaa() { if (!robot) return; modus = 'dans'; mal = null; robot.rotation.y = Math.atan2(camera.position.x - robot.position.x, camera.position.z - robot.position.z); robot.position.y = 0;
  spill('Dance'); konfetti.im.visible = true; konfetti.t = 0; konfetti.data.forEach(d => { d.p.set(robot.position.x + (Math.random() - 0.5), 3, robot.position.z + (Math.random() - 0.5)); d.v.set((Math.random() - 0.5) * 6, 4 + Math.random() * 5, (Math.random() - 0.5) * 6); });
  setTimeout(() => { if (modus === 'dans') { spill('Idle'); modus = 'vent'; ventTimer = 2; ventSteg = 0; velg('robot', 'vent'); } }, 4200); }
const sprett = [];

/* ======================= Input ======================= */
const pek = new Map(); let dra = null, flyttet = 0, knip0 = 0, dist0 = 0; const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const el = renderer.domElement;
el.addEventListener('pointerdown', e => { el.setPointerCapture(e.pointerId); pek.set(e.pointerId, {x: e.clientX, y: e.clientY}); flyttet = 0; if (pek.size === 1) dra = {x: e.clientX, y: e.clientY, t: cam.target.clone()}; if (pek.size === 2) { const [a, b] = [...pek.values()]; knip0 = Math.hypot(a.x - b.x, a.y - b.y); dist0 = cam.dist; } });
el.addEventListener('pointermove', e => { if (!pek.has(e.pointerId)) return; pek.set(e.pointerId, {x: e.clientX, y: e.clientY});
  if (pek.size === 2) { const [a, b] = [...pek.values()]; cam.dist = THREE.MathUtils.clamp(dist0 * knip0 / Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)), 18, 80); flyttet = 99; plasserKamera(); return; }
  if (dra) { const dx = e.clientX - dra.x, dy = e.clientY - dra.y; flyttet = Math.max(flyttet, Math.hypot(dx, dy)); const k = cam.dist / innerHeight * 0.75;
    const fx = new THREE.Vector3(Math.cos(cam.yaw), 0, -Math.sin(cam.yaw)), fz = new THREE.Vector3(Math.sin(cam.yaw), 0, Math.cos(cam.yaw));
    cam.target.copy(dra.t).addScaledVector(fx, -dx * k).addScaledVector(fz, -dy * k * 1.35); cam.target.x = THREE.MathUtils.clamp(cam.target.x, -28, 28); cam.target.z = THREE.MathUtils.clamp(cam.target.z, -24, 24); plasserKamera(); } });
el.addEventListener('pointerup', e => { if (pek.size === 1 && flyttet < 8) trykk(e.clientX, e.clientY); pek.delete(e.pointerId); if (!pek.size) dra = null; });
el.addEventListener('pointercancel', e => { pek.delete(e.pointerId); dra = null; });
el.addEventListener('wheel', e => { e.preventDefault(); cam.dist = THREE.MathUtils.clamp(cam.dist * (1 + Math.sign(e.deltaY) * 0.1), 18, 80); plasserKamera(); }, {passive: false});
function trykk(x, y) { ndc.set(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera);
  const t = ray.intersectObjects(klikkbare, true)[0]; if (!t) return; const o = t.object.userData.eier || t.object; sprett.push({o, t: 0});
  if (robot && modus === 'vent') { const p = o.getWorldPosition(new THREE.Vector3()); robot.rotation.y = Math.atan2(p.x - robot.position.x, p.z - robot.position.z); robot.position.y = 0; mal = null; spill('Wave', false); ventSteg = 2; ventTimer = 1.6; } }

/* ======================= Knapper og måling ======================= */
function velg(a, v) { document.querySelectorAll('[data-' + a + ']').forEach(b => b.classList.toggle('on', b.dataset[a] === v)); }
document.querySelectorAll('[data-tid]').forEach(b => b.onclick = () => { velg('tid', b.dataset.tid); settTid(b.dataset.tid); nullstill(); });
document.querySelectorAll('[data-robot]').forEach(b => b.onclick = () => { velg('robot', b.dataset.robot); if (b.dataset.robot === 'dans') nyttNivaa(); else if (robot) { spill('Idle'); modus = 'vent'; ventTimer = 1; ventSteg = 0; } });
document.querySelectorAll('[data-kval]').forEach(b => b.onclick = () => { if (b.dataset.kval !== KVAL) { const u = new URL(location.href); u.searchParams.set('kval', b.dataset.kval); location.href = u.href; } });
velg('kval', KVAL);
const maalEl = document.getElementById('maal'); let ramme = [], sisteVis = 0, fast = '';
function nullstill() { ramme = []; }
function stat() { const s = ramme.slice().sort((a, b) => b - a), snitt = ramme.reduce((a, b) => a + b, 0) / Math.max(1, ramme.length); const p = s[Math.floor(s.length * 0.01)] || 0; return {fps: snitt ? 1000 / snitt : 0, lav: p ? 1000 / p : 0}; }
document.getElementById('bench').onclick = () => { const ko = ['dag', 'kveld', 'regn']; const res = []; const neste = () => { if (!ko.length) { window.__benchmark = res; fast = 'Måling (' + KVAL + ', snitt / 1 % lav):\n' + res.map(r => `${r.t.padEnd(5)} ${r.fps.toFixed(0).padStart(3)} / ${r.lav.toFixed(0).padStart(3)} bilder/s`).join('\n'); return; }
  const t = ko.shift(); velg('tid', t); settTid(t); setTimeout(() => { nullstill(); setTimeout(() => { res.push(Object.assign({t}, stat())); neste(); }, 5000); }, 800); }; neste(); };

/* ======================= Bygg alt ======================= */
function bygg() {
  renderer.setPixelRatio(KV[KVAL].pr); sol.shadow.mapSize.set(KV[KVAL].skygge, KV[KVAL].skygge);
  lagTerreng(); lagVegetasjon(); lagGjerde(); lagLave(); lagHonsehus(); lagAkre(); lagMarkedsbod(); lagVaer(); settTid('dag');
  new THREE.GLTFLoader().load(ROBOT_URL, gl => {
    robot = gl.scene; const b = new THREE.Box3().setFromObject(robot); robot.scale.setScalar(1.9 / (b.max.y - b.min.y)); const b2 = new THREE.Box3().setFromObject(robot); robot.position.set(-1, -b2.min.y, 4.2);
    robot.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } if (o.isBone && /^Head(_\d+)?$/.test(o.name) && !hode) hode = o; });
    scene.add(robot); mixer = new THREE.AnimationMixer(robot); gl.animations.forEach(a => klipp[a.name] = a); spill('Idle');
    hatt = lagHatt(); scene.add(hatt); robot.updateMatrixWorld(true); if (hode) { const hp = hode.getWorldPosition(new THREE.Vector3()); const bb = new THREE.Box3().setFromObject(robot); hattOffset = bb.max.y - hp.y - 0.12; hatt.scale.setScalar(0.8); }
    robot.position.y = 0;
    document.getElementById('last').style.display = 'none';
  }, undefined, () => { document.getElementById('last').textContent = 'Fant ikke roboten'; });
}

/* ======================= Løkke ======================= */
const klokke = new THREE.Clock(), tmp = new THREE.Vector3(), m4 = new THREE.Matrix4();
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(klokke.getDelta(), 0.05), t = klokke.elapsedTime; ramme.push(dt * 1000); if (ramme.length > 300) ramme.shift();
  if (mixer) mixer.update(dt);
  if (robot) {
    if (mal) { tmp.copy(mal.p).sub(robot.position); tmp.y = 0; const d = tmp.length(); if (d < 0.12) { const f = mal.ferdig; mal = null; f && f(); } else { robot.rotation.y = Math.atan2(tmp.x, tmp.z); robot.position.y = 0; robot.position.addScaledVector(tmp.normalize(), Math.min(d, dt * 2.3)); } }
    else if (modus === 'vent') { ventTimer -= dt; if (ventTimer <= 0) { if (ventSteg === 2) { spill('Idle'); robot.position.y = 0; ventSteg = 0; ventTimer = 1.5; } else nesteVent(); } }
    if (hode && hatt) { hode.getWorldPosition(tmp); hatt.position.set(tmp.x, tmp.y + hattOffset, tmp.z); hatt.rotation.set(0, robot.rotation.y, 0); }
  }

  for (let i = sprett.length - 1; i >= 0; i--) { const s = sprett[i]; s.t += dt; const k = Math.sin(Math.min(s.t / 0.35, 1) * Math.PI); if (s.o.userData.skala0 === undefined) s.o.userData.skala0 = s.o.scale.x; const base = s.o.userData.skala0; s.o.scale.setScalar(base * (1 + k * 0.08)); if (s.t > 0.35) { s.o.scale.setScalar(base); sprett.splice(i, 1); } }
  if (VANN) VANN.material.opacity = 0.86 + Math.sin(t * 1.3) * 0.03;
  if (regn && regn.visible) { const p = regn.geometry.attributes.position; for (let i = 0; i < p.count; i += 2) { let y = p.getY(i) - dt * 22; if (y < 0) y += 30; p.setY(i, y); p.setY(i + 1, y - 0.6); } p.needsUpdate = true; regn.position.set(cam.target.x, 0, cam.target.z); }
  if (konfetti.im.visible) { konfetti.t += dt; konfetti.data.forEach((d, i) => { d.v.y -= 9 * dt; d.v.multiplyScalar(0.985); d.p.addScaledVector(d.v, dt); if (d.p.y < 0.05) { d.p.y = 0.05; d.v.set(0, 0, 0); } d.r.x += dt * d.w; d.r.y += dt * d.w * 0.7; m4.makeRotationFromEuler(d.r).setPosition(d.p); konfetti.im.setMatrixAt(i, m4); }); konfetti.im.instanceMatrix.needsUpdate = true; if (konfetti.t > 4.6) konfetti.im.visible = false; }

    maalEl.textContent = (fast ? fast + '\n' : '') + `${VERSJON} · ${KVAL} · ${TID}\n${s.fps.toFixed(0)} bilder/s (1 % lav ${s.lav.toFixed(0)})\ntegnekall ${i.calls} · trekanter ${(i.triangles / 1000).toFixed(0)}k · piksler ${renderer.getPixelRatio().toFixed(2)}x`; }
}
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
window.__testscene = {settTid, nyttNivaa, kamera: (x, z, d) => { cam.target.set(x, 0, z); if (d) cam.dist = d; plasserKamera(); }, info: () => Object.assign({}, renderer.info.render), get robot() { return robot; }};
bygg(); loop();
</script>
