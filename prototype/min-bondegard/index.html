<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Min Bondegård – grafisk testscene</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#9fd3f5;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block}
  .panel{position:fixed;left:8px;right:8px;top:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;pointer-events:none}
  .grp{display:flex;gap:4px;background:rgba(255,255,255,.88);border-radius:12px;padding:4px;pointer-events:auto;box-shadow:0 2px 6px rgba(0,0,0,.15)}
  .grp b{font-size:12px;color:#3b3b3b;align-self:center;padding:0 4px}
  button{font:600 14px system-ui,sans-serif;border:0;border-radius:9px;padding:9px 12px;min-height:40px;background:#eef3f7;color:#233;cursor:pointer}
  button.on{background:#ffd23f;color:#2b2100}
  button:focus-visible{outline:3px solid #1b6fd1;outline-offset:2px}
  #maal{position:fixed;right:8px;bottom:8px;background:rgba(0,0,0,.62);color:#fff;font:12px/1.45 ui-monospace,Menlo,monospace;padding:8px 10px;border-radius:10px;white-space:pre;pointer-events:auto;max-width:92vw;overflow:auto}
  #info{position:fixed;left:8px;bottom:8px;background:rgba(255,255,255,.9);border-radius:10px;padding:8px 10px;font-size:13px;color:#233;max-width:46vw}
  #last{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#9fd3f5;font:600 20px system-ui;color:#1d3b52;z-index:5}
  @media (max-width:600px){button{padding:8px 9px;font-size:13px}#info{display:none}}
</style>
</head>
<body>
<div id="last">Laster gården …</div>
<div class="panel">
  <div class="grp" role="group" aria-label="Stilretning"><b>Stil</b>
    <button data-stil="A" class="on">A Solrik</button><button data-stil="B">B Tegnefilm</button><button data-stil="C">C Pastell</button></div>
  <div class="grp" role="group" aria-label="Tid og vær"><b>Vær</b>
    <button data-tid="dag" class="on">Dag</button><button data-tid="kveld">Kveld</button><button data-tid="regn">Regn</button></div>
  <div class="grp" role="group" aria-label="Roboten"><b>Robot</b>
    <button data-robot="vent" class="on">Venter</button><button data-robot="dans">Nytt nivå!</button></div>
  <div class="grp" role="group" aria-label="Måling"><button id="bench">Mål ytelse</button></div>
</div>
<div id="info">Testscene uten spill. Dra for å flytte, rull eller knip for å zoome. Trykk på ting på gården.</div>
<div id="maal">…</div>

<script src="../../vendor/three-r128.min.js"></script>
<script src="../../ecoins/gltfloader-r128.js"></script>
<script>
'use strict';
const VERSJON = 'testscene 0.1.0';
const ROBOT_URL = '../../ecoins/helt-robot-v2.glb';
const REV_URL = '../../prototype/figurer/rev/rev.glb';

/* ---------- Renderer, scene, kamera ---------- */
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, innerWidth/innerHeight, 0.5, 400);
const cam = {target:new THREE.Vector3(-1,0,3), dist:38, yaw:Math.PI/4, pitch:0.88};
function placeCamera(){
  const t = cam.target, d = cam.dist;
  camera.position.set(t.x + Math.sin(cam.yaw)*Math.cos(cam.pitch)*d, t.y + Math.sin(cam.pitch)*d, t.z + Math.cos(cam.yaw)*Math.cos(cam.pitch)*d);
  camera.lookAt(t);
}
placeCamera();

const hemi = new THREE.HemisphereLight(0xcfe8ff, 0x6a8a4a, 0.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2d6, 2.2);
sun.position.set(-30, 45, 25);
sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera, {left:-34,right:34,top:34,bottom:-34,near:1,far:120});
sun.shadow.bias = -0.0006;
scene.add(sun);
const kveldslys = new THREE.PointLight(0xffb45c, 0, 18, 2);
kveldslys.position.set(-7, 4.2, -1.5);
scene.add(kveldslys);

/* ---------- Stilretninger ---------- */
let STIL = 'A';
const toonGrad = (()=>{const d=new Uint8Array([90,170,255]);const t=new THREE.DataTexture(d,3,1,THREE.LuminanceFormat);t.minFilter=t.magFilter=THREE.NearestFilter;t.needsUpdate=true;return t;})();
function pastell(hex){const c=new THREE.Color(hex);const hsl={};c.getHSL(hsl);c.setHSL(hsl.h,hsl.s*0.7,Math.min(0.92,hsl.l*0.85+0.18));return c;}
function mat(hex, o={}){
  let m;
  if(STIL==='A') m = new THREE.MeshStandardMaterial({color:hex, roughness:o.rough ?? 0.85, metalness:0});
  else if(STIL==='B') m = new THREE.MeshToonMaterial({color:hex, gradientMap:toonGrad});
  else m = new THREE.MeshLambertMaterial({color:pastell(hex)});
  if(STIL!=='C') m.color.convertSRGBToLinear(); else m.color.convertSRGBToLinear();
  if(o.emissive){m.emissive = new THREE.Color(o.emissive).convertSRGBToLinear(); m.emissiveIntensity = 0; m.userData.lys = true;}
  if(o.transparent){m.transparent=true; m.opacity=o.opacity ?? 0.8;}
  if(o.side) m.side = o.side;
  return m;
}
const lysMaterialer = [];
function M(hex,o){const m=mat(hex,o); if(m.userData.lys) lysMaterialer.push(m); return m;}

/* ---------- Hjelpere for geometri ---------- */
const verden = new THREE.Group(); scene.add(verden);
const klikkbare = [];
function mesh(geo, m, x=0,y=0,z=0, parent=verden){const me=new THREE.Mesh(geo,m);me.position.set(x,y,z);me.castShadow=true;me.receiveShadow=true;parent.add(me);return me;}
function rund(w,h,d,r=0.15){ // avrundet boks via skalert kapsel-lignende boks
  const g = new THREE.BoxGeometry(w,h,d,2,2,2); const p=g.attributes.position; const v=new THREE.Vector3();
  for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i); const k=1-r*0.6*(Math.abs(v.x)/(w/2))*(Math.abs(v.y)/(h/2))*(Math.abs(v.z)/(d/2)); v.multiplyScalar(k); p.setXYZ(i,v.x,v.y,v.z);} g.computeVertexNormals(); return g;}
function prisme(b,h,d){ // trekantet tak: bredde b, høyde h, dybde d, grunnflate i y=0
  const sh=new THREE.Shape(); sh.moveTo(-b/2,0); sh.lineTo(b/2,0); sh.lineTo(0,h); sh.lineTo(-b/2,0);
  const g=new THREE.ExtrudeGeometry(sh,{depth:d,bevelEnabled:false}); g.translate(0,0,-d/2); return g;}
function tekstTekstur(tekst, bg='#f6efe0', fg='#3a2a1a', w=512, h=160){
  const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d');
  x.fillStyle=bg; x.fillRect(0,0,w,h); x.strokeStyle=fg; x.lineWidth=10; x.strokeRect(8,8,w-16,h-16);
  x.fillStyle=fg; x.font='bold '+Math.round(h*0.5)+'px system-ui,sans-serif'; x.textAlign='center'; x.textBaseline='middle'; x.fillText(tekst,w/2,h/2+4);
  const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; t.anisotropy=4; return t;}

/* ---------- Terreng ---------- */
function elvZ(x){return -24 + Math.sin(x*0.07)*5;}
function hoyde(x,z){
  const d = Math.hypot(x*0.9, z);
  let h = 0;
  if(d>26) h += (d-26)*0.18 * (0.6+0.4*Math.sin(x*0.13)*Math.cos(z*0.11));
  h += Math.sin(x*0.21+1)*Math.cos(z*0.17)*0.25;
  const de = Math.abs(z - elvZ(x));
  if(de<5) h = Math.min(h, -1.2 + de*0.24);
  if(Math.abs(z-12)<1.6 && Math.abs(x)<70) h = Math.min(h,0.02);
  if(d<22) h *= Math.max(0,(d-14)/8);
  return h;
}
let vann, regnPunkter, regnbue, konfetti;
function byggVerden(){
  // rydd
  while(verden.children.length) verden.remove(verden.children[0]);
  klikkbare.length = 0; lysMaterialer.length = 0;
  const skygger = STIL!=='C';
  renderer.shadowMap.enabled = skygger; sun.castShadow = skygger;

  // bakke
  const g = new THREE.PlaneGeometry(200,200,100,100); g.rotateX(-Math.PI/2);
  const p = g.attributes.position; const farger=[]; const c=new THREE.Color();
  for(let i=0;i<p.count;i++){const x=p.getX(i), z=p.getZ(i); const h=hoyde(x,z); p.setY(i,h);
    const t = THREE.MathUtils.clamp(h/6,0,1); c.set(0x7cc24f).lerp(new THREE.Color(0x5d9a3c), t);
    if(h<-0.6) c.set(0xc9b27c); c.offsetHSL(0,0,(Math.sin(x*1.3)*Math.cos(z*1.1))*0.02); c.convertSRGBToLinear(); farger.push(c.r,c.g,c.b);}
  g.setAttribute('color', new THREE.Float32BufferAttribute(farger,3)); g.computeVertexNormals();
  const bm = M(0xffffff); bm.vertexColors = true;
  const bakke = mesh(g,bm); bakke.castShadow=false;

  // elv
  const vg = new THREE.PlaneGeometry(200,12,120,4); vg.rotateX(-Math.PI/2);
  const vp = vg.attributes.position; for(let i=0;i<vp.count;i++){const x=vp.getX(i); vp.setZ(i, vp.getZ(i)+elvZ(x)); vp.setY(i,-0.55);} vg.computeVertexNormals();
  vann = mesh(vg, M(0x4fb3e8,{transparent:true,opacity:0.85,rough:0.2})); vann.castShadow=false;

  // grusvei og innkjørsel
  mesh(new THREE.BoxGeometry(140,0.06,3), M(0xcdb68a), 0,0.03,12).castShadow=false;
  mesh(new THREE.BoxGeometry(3,0.06,10), M(0xcdb68a), -6,0.035,6).castShadow=false;

  // trær og skog
  const stamme = M(0x7a5233), krone = M(0x3f8f3a), krone2 = M(0x5aa845);
  const tre = (x,z,s=1,gran=false)=>{const y=hoyde(x,z);
    mesh(new THREE.CylinderGeometry(0.18*s,0.25*s,1.4*s,7), stamme, x,y+0.7*s,z);
    if(gran){ for(let k=0;k<3;k++) mesh(new THREE.ConeGeometry((1.5-k*0.35)*s,1.6*s,8), krone, x,y+(1.6+k*0.9)*s,z); }
    else { mesh(new THREE.IcosahedronGeometry(1.25*s,1), krone2, x,y+2.1*s,z); mesh(new THREE.IcosahedronGeometry(0.9*s,1), krone2, x+0.6*s,y+2.6*s,z+0.3*s); }};
  let seed=7; const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
  for(let i=0;i<70;i++){const x=-60+rnd()*36, z=-20+rnd()*40; if(Math.abs(z-12)<3) continue; tre(x,z,0.8+rnd()*0.6,rnd()<0.6);}
  for(let i=0;i<40;i++){const a=rnd()*Math.PI*2, r=30+rnd()*30; const x=Math.cos(a)*r, z=Math.sin(a)*r; if(Math.abs(z-elvZ(x))<6||Math.abs(z-12)<3||x<-24) continue; tre(x,z,0.9+rnd()*0.7,rnd()<0.4);}

  // låve: rød med hvite kanter
  const lave = new THREE.Group(); lave.position.set(-8,0,-5); verden.add(lave);
  const rod = M(0xb8322a), hvit = M(0xf5f1e8), tak = M(0x5b4a44);
  mesh(rund(8,5,6,0.05), rod, 0,2.5,0, lave);
  const takM = mesh(prisme(9.0,3.0,6.6), tak, 0,5,0, lave);
  mesh(prisme(8.0,2.7,0.2), rod, 0,5,3.0, lave); mesh(prisme(8.0,2.7,0.2), rod, 0,5,-3.0, lave);
  [-4,4].forEach(x=>{mesh(new THREE.BoxGeometry(0.25,5,0.25), hvit, x,2.5,3.05, lave); mesh(new THREE.BoxGeometry(0.25,5,0.25), hvit, x,2.5,-3.05, lave);});
  mesh(new THREE.BoxGeometry(8.2,0.25,0.25), hvit, 0,5,3.05, lave);
  const port = mesh(new THREE.BoxGeometry(3.2,3.4,0.15), M(0x9e2a24), 0,1.7,3.05, lave);
  mesh(new THREE.BoxGeometry(3.4,0.2,0.2), hvit, 0,3.45,3.12, lave);
  const kryss = new THREE.BoxGeometry(4.6,0.18,0.08); [0.82,-0.82].forEach(r=>{const k=mesh(kryss,hvit,0,1.7,3.15,lave);k.rotation.z=r;});
  const vindusM = M(0xf3e7c4,{emissive:0xffc770});
  [-2.8,2.8].forEach(x=>{mesh(new THREE.BoxGeometry(1,1,0.12), vindusM, x,3.4,3.08, lave); mesh(new THREE.BoxGeometry(1.25,0.15,0.14), hvit, x,2.85,3.1, lave);});
  mesh(new THREE.BoxGeometry(1.2,1.2,0.12), vindusM, 0,6.0,3.12, lave);
  lave.children.forEach(c=>c.userData.hopp=lave); klikkbare.push(lave);
  // silo
  mesh(new THREE.CylinderGeometry(1.4,1.4,7,16), M(0xe8e2d6), -13.5,3.5,-6);
  mesh(new THREE.SphereGeometry(1.42,16,8,0,Math.PI*2,0,Math.PI/2), M(0xb8322a), -13.5,7,-6);

  // hønsehus
  const hus = new THREE.Group(); hus.position.set(6,0,-7); verden.add(hus);
  mesh(rund(3.4,2.2,2.6,0.05), rod, 0,1.3,0, hus);
  mesh(prisme(4.0,1.4,3.0), tak, 0,2.4,0, hus);
  mesh(new THREE.BoxGeometry(0.7,0.9,0.1), M(0x3a2a20), 0.6,0.7,1.32, hus);
  mesh(new THREE.BoxGeometry(0.6,0.12,1.4), M(0xc9a36a), 0.6,0.25,2.0, hus).rotation.x=-0.35;
  for(let x=-1.75;x<=1.75;x+=3.5){mesh(new THREE.BoxGeometry(0.15,2.2,0.15), hvit, x,1.3,1.32, hus);}
  klikkbare.push(hus); hus.children.forEach(c=>c.userData.hopp=hus);

  // åkre: 6 stk, ulike vekststadier
  const jord = M(0x7b5435), hvete = M(0xe0b84a), groenn = M(0x8fcf4a);
  for(let i=0;i<6;i++){const fx = 3+ (i%3)*3.6, fz = 3 + Math.floor(i/3)*3.6;
    const ak = new THREE.Group(); ak.position.set(fx,0,fz); verden.add(ak);
    mesh(rund(3.1,0.35,3.1,0.1), jord, 0,0.12,0, ak);
    const steg = i%3; const hoy = steg===2?1.0:0.5;
    const stra = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.035,0.05,hoy,4), steg===2?hvete:groenn, 25); stra.castShadow=true;
    const aks = steg===2 ? new THREE.InstancedMesh(new THREE.SphereGeometry(0.09,5,4), hvete, 25) : null;
    const m4=new THREE.Matrix4(), e=new THREE.Euler(), qq=new THREE.Quaternion(), sc=new THREE.Vector3(1,1,1), pos=new THREE.Vector3(); let n=0;
    for(let a=0;a<5;a++) for(let b=0;b<5;b++){ const x=-1.15+a*0.57, z=-1.15+b*0.57, r=Math.sin(a*3+b)*0.12;
      e.set(0,0,r); qq.setFromEuler(e); pos.set(x, 0.3+hoy/2, z); m4.compose(pos,qq,sc); stra.setMatrixAt(n,m4);
      if(aks){ pos.set(x+r*0.5, 0.3+hoy+0.05, z); m4.compose(pos,qq,new THREE.Vector3(1,1.8,1)); aks.setMatrixAt(n,m4);} n++; }
    ak.add(stra); if(aks){ aks.castShadow=true; ak.add(aks); }
    klikkbare.push(ak); ak.children.forEach(c=>c.userData.hopp=ak);}

  // gjerde
  const stolpe = new THREE.BoxGeometry(0.18,1.0,0.18), planke=new THREE.BoxGeometry(2.0,0.12,0.06);
  const gjerde=(x1,z1,x2,z2)=>{const n=Math.round(Math.hypot(x2-x1,z2-z1)/2); for(let k=0;k<=n;k++){const x=x1+(x2-x1)*k/n, z=z1+(z2-z1)*k/n; mesh(stolpe,hvit,x,0.5,z); if(k<n){[0.35,0.75].forEach(y=>{const pl=mesh(planke,hvit,x+(x2-x1)/n/2,y,z+(z2-z1)/n/2); pl.rotation.y=-Math.atan2(z2-z1,x2-x1);});}}};
  gjerde(-16,10,-14,10); gjerde(-4,10,16,10); gjerde(16,10,16,-12); gjerde(16,-12,-16,-12); gjerde(-16,-12,-16,10);

  // markedsbu
  const bu = new THREE.Group(); bu.position.set(-11,0,8.3); verden.add(bu);
  mesh(rund(3,1,1.4,0.05), M(0xb07a4a), 0,0.6,0, bu);
  [-1.35,1.35].forEach(x=>mesh(new THREE.BoxGeometry(0.14,2.6,0.14), M(0x8a5a35), x,1.3,-0.6, bu));
  for(let s=0;s<6;s++){const st=mesh(new THREE.BoxGeometry(0.5,0.08,1.8), M(s%2?0xffffff:0xd93c3c), -1.25+s*0.5,2.55,-0.15, bu); st.rotation.x=0.32;}
  [0xe94b3c,0xf2c230,0xf6efe2].forEach((f,k)=>mesh(new THREE.SphereGeometry(0.18,8,6), M(f), -0.8+k*0.8,1.25,0.2, bu));
  klikkbare.push(bu); bu.children.forEach(c=>c.userData.hopp=bu);

  // benk
  const benk = new THREE.Group(); benk.position.set(-3,0,7.2); verden.add(benk);
  mesh(new THREE.BoxGeometry(2.2,0.12,0.6), M(0x9b6a3e), 0,0.55,0, benk);
  mesh(new THREE.BoxGeometry(2.2,0.5,0.1), M(0x9b6a3e), 0,0.9,-0.28, benk);
  [-0.9,0.9].forEach(x=>mesh(new THREE.BoxGeometry(0.12,0.55,0.5), M(0x5a3d26), x,0.27,0, benk));

  // veiskilt Elvedal
  const skilt = new THREE.Group(); skilt.position.set(-20,0,14); verden.add(skilt);
  mesh(new THREE.BoxGeometry(0.15,2.4,0.15), M(0x6b4a2e), 0,1.2,0, skilt);
  const sm = new THREE.MeshBasicMaterial({map:tekstTekstur('Elvedal')});
  const sk = new THREE.Mesh(new THREE.PlaneGeometry(2.6,0.82), sm); sk.position.set(0,2.2,0.09); skilt.add(sk);
  const sk2 = sk.clone(); sk2.rotation.y=Math.PI; sk2.position.z=-0.09; skilt.add(sk2);

  // lastebil med sjåfør
  const bil = new THREE.Group(); bil.position.set(10,0,12.6); verden.add(bil);
  mesh(rund(2.0,1.7,2.0,0.12), M(0x2f7fd0), 1.6,1.35,0, bil);
  mesh(new THREE.BoxGeometry(0.1,0.7,1.6), M(0xcfe9ff,{rough:0.2}), 2.62,1.65,0, bil);
  mesh(new THREE.BoxGeometry(3.4,0.35,2.1), M(0x31495e), -1.0,0.75,0, bil);
  const lasteplan = mesh(new THREE.BoxGeometry(3.3,1.1,2.0), M(0xf2f0ea), -1.0,1.5,0, bil);
  const bm2 = new THREE.MeshBasicMaterial({map:tekstTekstur('Elvedal','#ffffff','#2f7fd0',512,140)});
  [1,-1].forEach(s=>{const t=new THREE.Mesh(new THREE.PlaneGeometry(2.6,0.7),bm2); t.position.set(-1.0,1.55,s*1.01); if(s<0) t.rotation.y=Math.PI; bil.add(t);});
  [[1.6,1],[1.6,-1],[-1.9,1],[-1.9,-1]].forEach(([x,z])=>{const h=mesh(new THREE.CylinderGeometry(0.45,0.45,0.35,14), M(0x2a2a2a), x,0.45,z, bil); h.rotation.x=Math.PI/2;});
  person(bil, 1.6,1.55,0.1, 0x3b6ea8, 0xf2c39b, 0x5a3b22, true, 0.55);
  klikkbare.push(bil); bil.children.forEach(c=>c.userData.hopp=bil);

  // kunde ved markedsbua (bestemor)
  const kunde = new THREE.Group(); kunde.position.set(-11,0,10); kunde.rotation.y=Math.PI; verden.add(kunde);
  person(kunde,0,0,0, 0x9c4d8c, 0xf2c39b, 0xdedede, false, 1);
  klikkbare.push(kunde); kunde.children.forEach(c=>c.userData.hopp=kunde);

  // dyr: høner og ku (stilisert realistiske)
  hoener.length=0;
  [[4,-4.2],[5.6,-3.6],[7.2,-4.5]].forEach(([x,z],k)=>{const h=hone(x,z); h.rotation.y=k*1.7; hoener.push(h);});
  ku = rodkolle(12,-5);

  // regn, regnbue, konfetti
  const n=1600, rp=new Float32Array(n*6);
  for(let i=0;i<n;i++){const x=(Math.random()-0.5)*70, y=Math.random()*30, z=(Math.random()-0.5)*70; rp.set([x,y,z,x+0.08,y-0.7,z],i*6);}
  const rg=new THREE.BufferGeometry(); rg.setAttribute('position',new THREE.BufferAttribute(rp,3));
  regnPunkter = new THREE.LineSegments(rg,new THREE.LineBasicMaterial({color:0xbfd8ef,transparent:true,opacity:0.55})); regnPunkter.visible=false; verden.add(regnPunkter);

renderer.domElement.addEventListener('pointerdown', e=>{ renderer.domElement.setPointerCapture(e.pointerId); pekere.set(e.pointerId,{x:e.clientX,y:e.clientY}); flyttet=0;

  if(pekere.size===2){const [a,b]=[...pekere.values()]; knipStart=Math.hypot(a.x-b.x,a.y-b.y); distStart=cam.dist;} });

    const fx=new THREE.Vector3(Math.cos(cam.yaw),0,-Math.sin(cam.yaw)), fz=new THREE.Vector3(Math.sin(cam.yaw),0,Math.cos(cam.yaw));
    cam.target.copy(draStart.t).addScaledVector(fx,-dx*k).addScaledVector(fz,-dy*k*1.3); cam.target.x=THREE.MathUtils.clamp(cam.target.x,-30,30); cam.target.z=THREE.MathUtils.clamp(cam.target.z,-25,25); placeCamera(); } });

  const treff = ray.intersectObjects(klikkbare,true)[0]; if(!treff) return;

const maalEl=document.getElementById('maal'); let ramme=[]; let sisteVis=0;

function statistikk(){ const s=ramme.slice().sort((a,b)=>b-a); const snitt=ramme.reduce((a,b)=>a+b,0)/Math.max(1,ramme.length);
  const p99 = s[Math.floor(s.length*0.01)]||0; return {fps: snitt?1000/snitt:0, lav: p99?1000/p99:0}; }

  setTimeout(()=>{ nullstillMaal(); setTimeout(()=>{ const st=statistikk(); benchRes.push(Object.assign({},j,st,{kall:renderer.info.render.calls, tri:renderer.info.render.triangles})); nesteBench(); }, 4000); }, 800); }

/* ---------- Løkke ---------- */
const klokke = new THREE.Clock(); const tmp=new THREE.Vector3(), q=new THREE.Quaternion();
function loop(){
  requestAnimationFrame(loop);
  const dt = Math.min(klokke.getDelta(), 0.05), tt=klokke.elapsedTime;
  ramme.push(dt*1000); if(ramme.length>240) ramme.shift();
  if(robotMixer) robotMixer.update(dt); if(revMixer) revMixer.update(dt);
  // robotens bevegelse
  if(robot){
    if(mal){ tmp.copy(mal.p).sub(robot.position); tmp.y=0; const d=tmp.length();
      if(d<0.15){ const f=mal.deretter; mal=null; f&&f(); }
      else { robot.rotation.y = Math.atan2(tmp.x,tmp.z); robot.position.addScaledVector(tmp.normalize(), Math.min(d, dt*2.2)); } }
    else if(modus==='vent'){ ventTimer-=dt; if(ventTimer<=0){ if(ventSteg===2){ robotAktiv=spill(robotMixer,robotKlipp,'Idle',robotAktiv); ventSteg=0; ventTimer=2; } else nesteVent(); } }
    if(hode && hatt){ hode.getWorldPosition(tmp); hatt.position.set(tmp.x, tmp.y+hattOffset, tmp.z); hatt.rotation.set(0, robot.rotation.y, 0); }
  }
  // dyr
  hoener.forEach((h,k)=>{ h.children[2] && (h.children[2].position.y = 0.95 + Math.max(0,Math.sin(tt*3+k*2))*-0.12); });
  if(ku) ku.children[ku.children.length-1].rotation.x = Math.sin(tt*2)*0.25;
  for(let i=spretter.length-1;i>=0;i--){const s=spretter[i]; s.t+=dt; const k=Math.sin(Math.min(s.t/0.35,1)*Math.PI); s.obj.scale.setScalar(1+k*0.12); if(s.t>0.35){ s.obj.scale.setScalar(1); spretter.splice(i,1);} }
  if(vann) vann.material.opacity = 0.82 + Math.sin(tt*1.5)*0.04;
  if(regnPunkter && regnPunkter.visible){ const p=regnPunkter.geometry.attributes.position; for(let i=0;i<p.count;i+=2){ let y=p.getY(i)-dt*22; if(y<0) y+=30; p.setY(i,y); p.setY(i+1,y-0.7);} p.needsUpdate=true; regnPunkter.position.set(cam.target.x,0,cam.target.z); }
  if(konfetti && konfetti.obj.visible){ const k=konfetti; k.t+=dt; const m=new THREE.Matrix4(); k.data.forEach((d,i)=>{ d.v.y-=9*dt; d.v.multiplyScalar(0.985); d.p.addScaledVector(d.v,dt); if(d.p.y<0.05){d.p.y=0.05; d.v.set(0,0,0);} d.r.x+=dt*d.w; d.r.y+=dt*d.w*0.7; m.makeRotationFromEuler(d.r).setPosition(d.p); k.obj.setMatrixAt(i,m); }); k.obj.instanceMatrix.needsUpdate=true; if(k.t>4.5) k.obj.visible=false; }
  renderer.render(scene,camera);
  if(tt-sisteVis>0.5){ sisteVis=tt; const st=statistikk(); maalEl.textContent = (maalEl.dataset.fast? maalEl.dataset.fast+'\n':'') +
    `${VERSJON} · stil ${STIL} · ${TID}\n${st.fps.toFixed(0)} bilder/s (1 % lav ${st.lav.toFixed(0)})\ntegnekall ${renderer.info.render.calls} · trekanter ${(renderer.info.render.triangles/1000).toFixed(0)}k · piksler ${renderer.getPixelRatio()}x`; }
}
