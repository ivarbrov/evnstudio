}
const M4 = (x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, sx = 1, sy = sx, sz = sx) => new THREE.Matrix4().compose(new THREE.Vector3(x, y, z), new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, ry, rz)), new THREE.Vector3(sx, sy, sz));

/* ======================= Prosedyriske teksturer ======================= */
function lerret(w, h, tegn) { const c = document.createElement('canvas'); c.width = w; c.height = h; tegn(c.getContext('2d'), w, h); return c; }

    const n = 8, bw = w / n;

      x.globalAlpha = 0.18; x.fillStyle = '#fff'; x.fillRect(i * bw + 2, 0, 3, h);
      x.globalAlpha = 0.5; x.fillStyle = '#000'; [24, h - 24].forEach(y => { x.beginPath(); x.arc(i * bw + bw / 2, y, 2.2, 0, 7); x.fill(); });
      if (rnd() < 0.4) { x.globalAlpha = 0.22; x.beginPath(); x.ellipse(i * bw + rr(12, bw - 12), rr(60, h - 60), 5, 9, 0, 0, 7); x.fill(); }
      x.globalAlpha = 1; x.fillStyle = fuge; x.fillRect(i * bw, 0, 3, h);

  });

    const rader = 8, sw = w / 8, sh = h / rader;
    x.fillStyle = '#2a1e1a'; x.fillRect(0, 0, w, h);

      const c = new THREE.Color(base); c.offsetHSL((rnd() - 0.5) * 0.02, (rnd() - 0.5) * 0.1, (rnd() - 0.5) * 0.08);

    x.fillStyle = '#6e4a2c'; x.fillRect(0, 0, w, h);

    for (let i = 0; i < 900; i++) { x.strokeStyle = rnd() < 0.5 ? 'rgba(140,105,40,.45)' : 'rgba(250,225,140,.5)'; x.lineWidth = rr(0.8, 2); const px = rr(0, w), py = rr(0, h), a = rr(-0.4, 0.4); x.beginPath(); x.moveTo(px, py); x.lineTo(px + Math.cos(a) * 26, py + Math.sin(a) * 26); x.stroke(); } });

const konfetti = (() => { const n = 300, im = new THREE.InstancedMesh(new THREE.PlaneGeometry(0.16, 0.09), new THREE.MeshBasicMaterial({side: THREE.DoubleSide}), n); const c = new THREE.Color(); const data = [];

const sprett = [];

const vinkelDiff = (a, b) => Math.atan2(Math.sin(b - a), Math.cos(b - a));
const snuMot = (a, b, maks) => { const d = vinkelDiff(a, b); return a + Math.sign(d) * Math.min(Math.abs(d), maks); };

/* ======================= Reven Nysgjerrig (gjenbrukt rev.glb, bare vennen på gården – ikke spillbar) ======================= */
let rev = null, revMixer = null, revKlipp = {}, revAktiv = null;
const boble = document.getElementById('boble');
let bobleTid = 0;
function revSpill(n, loop = true) { if (!revMixer || !revKlipp[n]) return; const a = revMixer.clipAction(revKlipp[n]); a.reset(); a.setLoop(loop ? THREE.LoopRepeat : THREE.LoopOnce); a.clampWhenFinished = !loop; if (revAktiv && revAktiv !== a) revAktiv.fadeOut(0.25); a.fadeIn(0.25).play(); revAktiv = a; }
const HILSNER = ['Hei, nabo! Jeg er Nysgjerrig.', 'Skal vi gjøre gården til den fineste i Elvedal?', 'Hønene dine ser glade ut!'];
let hilsI = 0;
function hilsRev(vis) { if (!rev) return; if (robot) rev.rotation.y = Math.atan2(robot.position.x - rev.position.x, robot.position.z - rev.position.z); revSpill('Wave', false); setTimeout(() => revSpill('Idle'), 2200);

function lagRev() {

    rev.position.set(-17.6, hoyde(-17.6, 4.0) - b2.min.y, 4.0); rev.rotation.y = Math.PI / 2 + 0.35; // i skogkanten utenfor gjerdet rev.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; o.userData.eier = rev; } });

/* ======================= Input ======================= */
const pek = new Map(); let dra = null, flyttet = 0, knip0 = 0, dist0 = 0; const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const el = renderer.domElement;
el.addEventListener('pointerdown', e => { el.setPointerCapture(e.pointerId); pek.set(e.pointerId, {x: e.clientX, y: e.clientY}); flyttet = 0; if (pek.size === 1) dra = {x: e.clientX, y: e.clientY, t: cam.target.clone()}; if (pek.size === 2) { const [a, b] = [...pek.values()]; knip0 = Math.hypot(a.x - b.x, a.y - b.y); dist0 = cam.dist; } });

    cam.target.copy(dra.t).addScaledVector(fx, -dx * k).addScaledVector(fz, -dy * k * 1.35); cam.target.x = THREE.MathUtils.clamp(cam.target.x, -28, 28); cam.target.z = THREE.MathUtils.clamp(cam.target.z, -24, 24); plasserKamera(); } });

function trykk(x, y) { ndc.set(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera);

/* ======================= Knapper og måling ======================= */

}

/* ======================= Løkke ======================= */
const adaptiv = {paa: !new URLSearchParams(location.search).has('fast'), t: 0, n: 0};
const klokke = new THREE.Clock(), tmp = new THREE.Vector3(), m4 = new THREE.Matrix4();
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(klokke.getDelta(), 0.05), t = klokke.elapsedTime; ramme.push(dt * 1000); if (ramme.length > 300) ramme.shift();
  if (mixer) mixer.update(dt); if (revMixer) revMixer.update(dt);
  if (bobleTid > 0 && rev) { bobleTid -= dt; tmp.copy(rev.position); tmp.y += 2.6; tmp.project(camera); boble.style.left = ((tmp.x + 1) / 2 * innerWidth) + 'px'; boble.style.top = ((1 - tmp.y) / 2 * innerHeight) + 'px'; if (bobleTid <= 0) boble.style.display = 'none'; }

    if (mal) { tmp.copy(mal.vei[0]).sub(robot.position); tmp.y = 0; const d = tmp.length();

  }
  oppdaterHoner(dt, t);
  for (let i = sprett.length - 1; i >= 0; i--) { const s = sprett[i]; s.t += dt; const k = Math.sin(Math.min(s.t / 0.35, 1) * Math.PI); if (s.o.userData.skala0 === undefined) s.o.userData.skala0 = s.o.scale.x; const base = s.o.userData.skala0; s.o.scale.setScalar(base * (1 + k * 0.08)); if (s.t > 0.35) { s.o.scale.setScalar(base); sprett.splice(i, 1); } }
  if (VANN) VANN.material.uniforms.tid.value = t;
  if (omradeVist) { omradeTid += dt; omradeVist.kant.material.opacity = 0.65 + 0.3 * Math.sin(omradeTid * 5); }
  if (regn && regn.visible) { const p = regn.geometry.attributes.position; for (let i = 0; i < p.count; i += 2) { let y = p.getY(i) - dt * 22; if (y < 0) y += 30; p.setY(i, y); p.setY(i + 1, y - 0.6); } p.needsUpdate = true; regn.position.set(cam.target.x, 0, cam.target.z); }
  if (konfetti.im.visible) { konfetti.t += dt; konfetti.data.forEach((d, i) => { d.v.y -= 9 * dt; d.v.multiplyScalar(0.985); d.p.addScaledVector(d.v, dt); if (d.p.y < 0.05) { d.p.y = 0.05; d.v.set(0, 0, 0); } d.r.x += dt * d.w; d.r.y += dt * d.w * 0.7; m4.makeRotationFromEuler(d.r).setPosition(d.p); konfetti.im.setMatrixAt(i, m4); }); konfetti.im.instanceMatrix.needsUpdate = true; if (konfetti.t > 4.6) konfetti.im.visible = false; }
  sol.target.position.copy(cam.target); sol.position.set(cam.target.x + TIDER[TID].pos[0], TIDER[TID].pos[1], cam.target.z + TIDER[TID].pos[2]);
  renderer.render(scene, camera);
  adaptiv.t += dt; adaptiv.n++; if (adaptiv.paa && adaptiv.t > 2.5) { const fps = adaptiv.n / adaptiv.t; const pr = renderer.getPixelRatio();
    if (fps < 50 && pr > 0.75) renderer.setPixelRatio(Math.max(0.75, pr - 0.25)); else if (fps > 58 && pr < KV[KVAL].pr) renderer.setPixelRatio(Math.min(KV[KVAL].pr, pr + 0.25)); adaptiv.t = 0; adaptiv.n = 0; }
  if (t - sisteVis > 0.5) { sisteVis = t; const s = stat(); const i = renderer.info.render;
    maalEl.textContent = (fast ? fast + '\n' : '') + `${VERSJON} · ${KVAL} · ${TID}\n${s.fps.toFixed(0)} bilder/s (1 % lav ${s.lav.toFixed(0)})\ntegnekall ${i.calls} · trekanter ${(i.triangles / 1000).toFixed(0)}k · piksler ${renderer.getPixelRatio().toFixed(2)}x`; }
}

/* Kostnadsanalyse: tegner scenen mange ganger og måler tid per kategori */
function profil(n = 12) {
  const gl = renderer.getContext(), px = new Uint8Array(4);
  const tid = () => { renderer.render(scene, camera); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); const t0 = performance.now(); for (let i = 0; i < n; i++) { renderer.render(scene, camera); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); } return (performance.now() - t0) / n; };
  if (robot) robot.userData.kat = 'robot'; if (hatt) hatt.userData.kat = 'robot'; hoener.forEach(h => h.userData.kat = 'dyr'); if (window.__kyllinger) window.__kyllinger.forEach(h => h.userData.kat = 'dyr');
  const kats = [...new Set(scene.children.map(c => c.userData.kat).filter(Boolean))];
  const alle = tid(); const info0 = Object.assign({}, renderer.info.render); const res = {alle: {ms: alle, kall: info0.calls, tri: info0.triangles}};
  kats.forEach(k => { const skjult = scene.children.filter(c => c.userData.kat === k && c.visible); skjult.forEach(c => c.visible = false); const ms = tid(); const inf = Object.assign({}, renderer.info.render); skjult.forEach(c => c.visible = true);
    res[k] = {ms: alle - ms, kall: info0.calls - inf.calls, tri: info0.triangles - inf.triangles}; });
  const sk = renderer.shadowMap.enabled; renderer.shadowMap.enabled = false; scene.traverse(o => { if (o.material) o.material.needsUpdate = true; }); const ms = tid(); const inf = Object.assign({}, renderer.info.render); renderer.shadowMap.enabled = sk; scene.traverse(o => { if (o.material) o.material.needsUpdate = true; });
  res.skygger = {ms: alle - ms, kall: info0.calls - inf.calls, tri: info0.triangles - inf.triangles};
  return res;
}
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
window.__testscene = {profil, settTid, nyttNivaa, kamera: (x, z, d) => { cam.target.set(x, 0, z); if (d) cam.dist = d; plasserKamera(); }, info: () => Object.assign({}, renderer.info.render), get robot() { return robot; }, spill: (n, l) => spill(n, l), klipp, get rev() { return rev; }, kameraObj: camera, hilsRev, get modus() { return modus; }, set modus(v) { modus = v; }};
