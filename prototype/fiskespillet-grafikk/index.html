<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fiskespillet – ny grafikk (testscener)</title>
<!-- Testscener for Evens valg av grafikk (5.11.2026). Prototype: endrer ikke spillet. -->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e2a4a; font-family: Nunito, system-ui, sans-serif; color: #fff; }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #topp { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 5; }
  #topp button, #bytt { font: 800 17px Nunito, system-ui, sans-serif; border: 3px solid #ffd34d; background: #1d2440; color: #fff; border-radius: 14px; padding: 8px 14px; min-height: 48px; cursor: pointer; }
  #topp button[aria-pressed="true"] { background: #ffd34d; color: #1d2440; }
  #bytt { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 5; background: #ffd34d; color: #1d2440; font-size: 19px; padding: 10px 22px; }
  #merke { position: fixed; top: 72px; left: 50%; transform: translateX(-50%); z-index: 5; background: rgba(29,36,64,.85); border-radius: 12px; padding: 6px 14px; font-weight: 800; font-size: 18px; text-align: center; }
  #merke small { display: block; font-weight: 600; font-size: 14px; opacity: .85; }
  #foer { position: fixed; inset: 0; z-index: 3; background: #0e2a4a center/contain no-repeat; display: none; }
  #foer.vis { display: block; }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  @media (max-width: 520px) { #topp button { font-size: 15px; padding: 6px 9px; } #merke { top: 66px; font-size: 16px; } }
</style>
</head>
<body>
<canvas id="c" aria-label="Testscene med ny grafikk"></canvas>
<div id="foer" role="img" aria-label="Slik ser det ut i spillet nå"></div>
<nav id="topp" aria-label="Velg testscene">
  <button type="button" data-scene="fisk" aria-pressed="true">🐟 Fisk</button>
  <button type="button" data-scene="baat" aria-pressed="false">⛵ Båter</button>
  <button type="button" data-scene="hav" aria-pressed="false">🌊 Hav og øy</button>
</nav>
<div id="merke" aria-live="polite"></div>
<button type="button" id="bytt">👀 Se hvordan det er nå</button>

<script src="../../vendor/three-r128.min.js"></script>
<script>
'use strict';
// ======================================================
//  Oppsett
// ======================================================
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
const mobil = matchMedia('(pointer: coarse)').matches;
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, mobil ? 1.5 : 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const C = h => new THREE.Color(h).convertSRGBToLinear();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 2000);
function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight; camera.fov = innerWidth < innerHeight ? 60 : 45; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

function lerret(w, h, tegn) { const cv = document.createElement('canvas'); cv.width = w; cv.height = h; tegn(cv.getContext('2d'), w, h); return cv; }
function tekstur(cv, gjenta) { const t = new THREE.CanvasTexture(cv); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4; if (gjenta) { t.wrapS = t.wrapT = THREE.RepeatWrapping; } return t; }
function dataTekstur(cv, gjenta) { const t = new THREE.CanvasTexture(cv); t.anisotropy = 4; if (gjenta) { t.wrapS = t.wrapT = THREE.RepeatWrapping; } return t; }
const rnd = (a, b) => a + Math.random() * (b - a);
// Enkel verdistøy (for øya og steiner)
function hash(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
function stoy(x, y) { const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy, u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  return (hash(ix, iy) * (1 - u) + hash(ix + 1, iy) * u) * (1 - v) + (hash(ix, iy + 1) * (1 - u) + hash(ix + 1, iy + 1) * u) * v; }
function fbm(x, y) { return stoy(x, y) * 0.55 + stoy(x * 2.1, y * 2.1) * 0.3 + stoy(x * 4.3, y * 4.3) * 0.15; }

// ======================================================
//  Felles himmel og lys
// ======================================================
function lagHimmel(scene, topp, horisont) {
  const mat = new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, uniforms: { topp: { value: C(topp) }, hor: { value: C(horisont) }, sol: { value: new THREE.Vector3(0.45, 0.55, -0.7).normalize() } },
    vertexShader: 'varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: `uniform vec3 topp, hor, sol; varying vec3 vD;
      void main(){ float h = clamp(vD.y, 0.0, 1.0); vec3 c = mix(hor, topp, pow(h, 0.55));
        float s = max(dot(normalize(vD), sol), 0.0); c += vec3(1.0, 0.85, 0.6) * (pow(s, 600.0) * 4.0 + pow(s, 12.0) * 0.25);
        if (vD.y < 0.0) c = hor; gl_FragColor = vec4(c, 1.0); }` });
  const m = new THREE.Mesh(new THREE.SphereGeometry(900, 32, 16), mat); scene.add(m);
  // Myke skyer
  const sky = tekstur(lerret(256, 128, (x, w, h) => { for (let i = 0; i < 14; i++) { const cx = rnd(50, 206), cy = rnd(55, 80), r = rnd(22, 42); const g = x.createRadialGradient(cx, cy, 0, cx, cy, r); g.addColorStop(0, 'rgba(255,255,255,.95)'); g.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(0, 0, w, h); } }));
  for (let i = 0; i < 10; i++) { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: sky, transparent: true, depthWrite: false, fog: false, opacity: 0.9 })); const v = rnd(0, Math.PI * 2), d = rnd(380, 600); s.position.set(Math.cos(v) * d, rnd(90, 180), Math.sin(v) * d); s.scale.set(rnd(160, 260), rnd(70, 100), 1); scene.add(s); }
  return m;
}
function lagLys(scene, skygge, omraade) {
  scene.add(new THREE.HemisphereLight(C(0xdff3ff), C(0x2f6f8f), 0.75));
  const sol = new THREE.DirectionalLight(C(0xfff0d8), 2.1); sol.position.set(40, 55, -50);
  if (skygge) { sol.castShadow = true; sol.shadow.mapSize.set(mobil ? 1024 : 2048, mobil ? 1024 : 2048); const s = sol.shadow.camera; s.left = s.bottom = -omraade; s.right = s.top = omraade; s.near = 1; s.far = 220; sol.shadow.bias = -0.0005; sol.shadow.normalBias = 0.03; }
  scene.add(sol); scene.add(sol.target); return sol;
}

// ======================================================
//  Vannet (brukes i alle scenene): bølger, glans fra sola, skum
// ======================================================
function lagVann(storrelse, deler, oyR) {
  const u = THREE.UniformsUtils.merge([THREE.UniformsLib.fog, {
    tid: { value: 0 }, grunn: { value: C(0x46e0d2) }, kyst: { value: C(0x1fb2d0) }, dyp: { value: C(0x0d4f9e) }, himmel: { value: C(0xbfe6ff) },
    sol: { value: new THREE.Vector3(40, 55, -50).normalize() }, oyR: { value: oyR || 0 }, kamera: { value: new THREE.Vector3() } }]);
  const mat = new THREE.ShaderMaterial({ uniforms: u, fog: true, transparent: false,
    vertexShader: `
      uniform float tid; varying vec3 vW; varying vec3 vN; varying float vH;
      #include <fog_pars_vertex>
      // Fire bølger med ulik retning, lengde og fart. Normalen regnes ut av de deriverte.
      void bolge(vec2 d, float k, float a, float f, vec2 p, inout float h, inout vec2 dh) {
        float ph = dot(d, p) * k + tid * f; h += a * sin(ph); dh += d * a * k * cos(ph); }
      void main() {
        vec4 w = modelMatrix * vec4(position, 1.0); float h = 0.0; vec2 dh = vec2(0.0);
        bolge(normalize(vec2(1.0, 0.3)), 0.11, 0.32, 1.1, w.xz, h, dh);
        bolge(normalize(vec2(-0.4, 1.0)), 0.17, 0.2, 1.5, w.xz, h, dh);
        bolge(normalize(vec2(0.7, -0.8)), 0.31, 0.09, 2.2, w.xz, h, dh);
        bolge(normalize(vec2(-1.0, -0.2)), 0.53, 0.045, 3.1, w.xz, h, dh);
        w.y += h; vH = h; vW = w.xyz; vN = normalize(vec3(-dh.x, 1.0, -dh.y));
        vec4 mvPosition = viewMatrix * w; gl_Position = projectionMatrix * mvPosition;
        #include <fog_vertex>
      }`,
    fragmentShader: `
      uniform float tid, oyR; uniform vec3 grunn, kyst, dyp, himmel, sol, kamera; varying vec3 vW; varying vec3 vN; varying float vH;
      #include <fog_pars_fragment>
      float h21(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      float st(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
        return mix(mix(h21(i), h21(i+vec2(1,0)), f.x), mix(h21(i+vec2(0,1)), h21(i+vec2(1,1)), f.x), f.y); }
      void main() {
        vec3 n = normalize(vN + vec3(st(vW.xz*0.9+tid*0.6)-0.5, 0.0, st(vW.zx*0.8-tid*0.5)-0.5) * 0.18);
        vec3 v = normalize(kamera - vW);
        float d = length(vW.xz);
        vec3 c = oyR > 0.0 ? mix(grunn, kyst, smoothstep(oyR + 1.0, oyR + 26.0, d)) : kyst;
        c = mix(c, dyp, oyR > 0.0 ? smoothstep(oyR + 30.0, oyR + 160.0, d) : 0.35);
        float fres = pow(1.0 - max(dot(n, v), 0.0), 4.0);
        c = mix(c, himmel, fres * 0.65);
        vec3 r = reflect(-sol, n); float spec = pow(max(dot(r, v), 0.0), 220.0);
        c += vec3(1.0, 0.95, 0.85) * spec * 2.2;
        // Skum på bølgetoppene og langs stranda
        float skum = smoothstep(0.6, 0.78, vH + st(vW.xz * 3.1 + tid) * 0.18) * 0.35;
        if (oyR > 0.0) { float s2 = smoothstep(oyR + 4.5, oyR + 0.8, d + sin(tid * 1.6 + atan(vW.z, vW.x) * 9.0) * 0.8);
          skum = max(skum, s2 * (0.55 + 0.45 * st(vW.xz * 2.5 + tid * 1.5))); }
        c = mix(c, vec3(0.97), skum);
        gl_FragColor = vec4(c, 1.0);
        #include <fog_fragment>
        #include <encodings_fragment>
      }` });
  const geo = new THREE.PlaneGeometry(storrelse, storrelse, deler, deler); geo.rotateX(-Math.PI / 2);
  const m = new THREE.Mesh(geo, mat); m.receiveShadow = false; m.userData.u = u; return m;
}

// ======================================================
//  1) Fisk: myk kropp, skjell, gjennomsiktige finner, ekte øyne
// ======================================================
function skjellTekstur() {
  return dataTekstur(lerret(256, 256, (x, w, h) => {
    x.fillStyle = '#808080'; x.fillRect(0, 0, w, h);
    const r = 16;
    for (let j = -1; j < h / (r * 0.8) + 1; j++) for (let i = -1; i < w / r + 1; i++) {
      const cx = i * r + (j % 2 ? r / 2 : 0), cy = j * r * 0.8;
      const g = x.createRadialGradient(cx, cy - r * 0.2, 1, cx, cy, r * 0.7); g.addColorStop(0, '#d0d0d0'); g.addColorStop(0.8, '#8a8a8a'); g.addColorStop(1, '#505050');
      x.fillStyle = g; x.beginPath(); x.arc(cx, cy, r * 0.62, 0, Math.PI); x.fill();
    }
  }), true);
}
const SKJELL = skjellTekstur(); SKJELL.repeat.set(5, 2.5);
function moenster(type, farge, ekstra) {
  return tekstur(lerret(512, 256, (x, w, h) => {
    // Mørk rygg, lys mage (u: hale→hode, v: mage→rygg)
    const g = x.createLinearGradient(0, h, 0, 0); g.addColorStop(0, ekstra.mage); g.addColorStop(0.42, farge); g.addColorStop(1, ekstra.rygg); x.fillStyle = g; x.fillRect(0, 0, w, h);
    if (type === 'striper') { for (const sx of [0.3, 0.58, 0.82]) { x.fillStyle = '#fff'; x.fillRect(sx * w - 18, 0, 36, h); x.fillStyle = '#1b1b1b'; x.fillRect(sx * w - 22, 0, 4, h); x.fillRect(sx * w + 18, 0, 4, h); } }
    if (type === 'prikker') { x.fillStyle = 'rgba(255,255,255,.85)'; for (let i = 0; i < 70; i++) { x.beginPath(); x.arc(rnd(0, w), rnd(h * 0.35, h), rnd(4, 11), 0, 7); x.fill(); } }
    if (type === 'gull') { for (let i = 0; i < 260; i++) { x.fillStyle = `rgba(255,255,${rnd(150, 255) | 0},${rnd(0.3, 0.9)})`; x.fillRect(rnd(0, w), rnd(0, h), 2, 2); } }
  }));
}
function finneTekstur(farge) {
  return tekstur(lerret(128, 128, (x, w, h) => {
    const g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, farge); g.addColorStop(1, 'rgba(255,255,255,0.35)'); x.fillStyle = g; x.fillRect(0, 0, w, h);
    x.strokeStyle = 'rgba(0,0,0,.25)'; x.lineWidth = 2; for (let i = 0; i < 12; i++) { x.beginPath(); x.moveTo(w / 2, h); x.lineTo(i / 11 * w, 0); x.stroke(); }
  }));
}
function finne(punkter, mat) {
  const s = new THREE.Shape(); s.moveTo(punkter[0][0], punkter[0][1]);
  for (let i = 1; i < punkter.length; i += 2) s.quadraticCurveTo(punkter[i][0], punkter[i][1], punkter[i + 1][0], punkter[i + 1][1]);
  const geo = new THREE.ShapeGeometry(s, 12);
  // UV fra boksen
  geo.computeBoundingBox(); const b = geo.boundingBox, p = geo.attributes.position, uv = geo.attributes.uv;
  for (let i = 0; i < p.count; i++) uv.setXY(i, (p.getX(i) - b.min.x) / (b.max.x - b.min.x), (p.getY(i) - b.min.y) / (b.max.y - b.min.y));
  return new THREE.Mesh(geo, mat);
}
function lagNyFisk(o) {
  const g = new THREE.Group(), kropp = new THREE.Group(); g.add(kropp);
  const L = o.L || 3, H = o.H || 1.3, W = o.W || 0.75;
  // Kroppen: en kule som smalner av mot halen og er litt flat i buken
  const geo = new THREE.SphereGeometry(1, 64, 40); geo.rotateZ(-Math.PI / 2);
  const p = geo.attributes.position, uv = geo.attributes.uv;
  for (let i = 0; i < p.count; i++) {
    let x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const t = (x + 1) / 2;                                   // 0 = hale, 1 = hode
    const smal = t < 0.55 ? 0.18 + 0.82 * Math.pow(Math.sin(t / 0.55 * Math.PI / 2), 0.8) : 1;
    y *= smal; z *= smal;
    if (y < 0) y *= 0.85;                                    // flatere buk
    y += (t < 0.3 ? 0 : 0.06 * Math.sin((t - 0.3) / 0.7 * Math.PI));  // litt pukkel
    p.setXYZ(i, x * L / 2, y * H / 2, z * W / 2);
    uv.setXY(i, t, (y + 1) / 2);
  }
  geo.computeVertexNormals();
  const mat = new THREE.MeshPhysicalMaterial({ map: moenster(o.moenster, o.farge, o), bumpMap: SKJELL, bumpScale: 0.012, roughness: o.metall ? 0.28 : 0.38, metalness: o.metall ? 0.75 : 0.05, clearcoat: 0.8, clearcoatRoughness: 0.18 });
  const k = new THREE.Mesh(geo, mat); k.castShadow = true; kropp.add(k);
  const fm = new THREE.MeshStandardMaterial({ map: finneTekstur(o.finne), transparent: true, opacity: 0.88, side: THREE.DoubleSide, roughness: 0.4, depthWrite: false });
  // Halefinne (gaffelformet)
  const hale = new THREE.Group(); hale.position.x = -L * 0.46; kropp.add(hale);
  const hf = finne([[0, 0], [-L * 0.18, H * 0.25], [-L * 0.34, H * 0.55], [-L * 0.24, 0.02], [-L * 0.34, -H * 0.55], [-L * 0.18, -H * 0.25], [0, 0]], fm); hale.add(hf);
  // Ryggfinne og bukfinne
  const rf = finne([[L * 0.22, H * 0.42], [L * 0.02, H * 0.95], [-L * 0.22, H * 0.36]], fm); kropp.add(rf);
  const bf = finne([[L * 0.02, -H * 0.36], [-L * 0.08, -H * 0.72], [-L * 0.2, -H * 0.3]], fm); kropp.add(bf);
  // Sidefinner som vifter
  const sider = [];
  for (const s of [-1, 1]) { const sf = finne([[0, 0], [-L * 0.12, -H * 0.05], [-L * 0.2, -H * 0.3], [-L * 0.06, -H * 0.18], [0, 0]], fm); sf.position.set(L * 0.2, -H * 0.12, s * W * 0.42); sf.rotation.y = s * 0.5; kropp.add(sf); sider.push(sf); }
  // Øyne med glans
  const hvit = new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.15, clearcoat: 1 }), iris = new THREE.MeshStandardMaterial({ color: C(o.iris || 0x2a5a2a), roughness: 0.3 }), svart = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.1 }), glans = new THREE.MeshBasicMaterial({ color: 0xffffff });
  for (const s of [-1, 1]) {
    const oy = new THREE.Group(); oy.position.set(L * 0.33, H * 0.12, s * W * 0.33); oy.rotation.y = s * -0.35; kropp.add(oy);
    const r = H * 0.16;
    const a = new THREE.Mesh(new THREE.SphereGeometry(r, 24, 16), hvit); a.scale.z = 0.6; oy.add(a);
    const b = new THREE.Mesh(new THREE.SphereGeometry(r * 0.62, 20, 14), iris); b.position.z = s * r * 0.42; b.scale.z = 0.5; oy.add(b);
    const c = new THREE.Mesh(new THREE.SphereGeometry(r * 0.36, 16, 12), svart); c.position.z = s * r * 0.58; c.scale.z = 0.5; oy.add(c);
    const d = new THREE.Mesh(new THREE.SphereGeometry(r * 0.12, 8, 6), glans); d.position.set(r * 0.18, r * 0.2, s * r * 0.72); oy.add(d);
  }
  // Munn
  const munn = new THREE.Mesh(new THREE.TorusGeometry(H * 0.08, H * 0.025, 8, 16, Math.PI), new THREE.MeshStandardMaterial({ color: C(o.rygg), roughness: 0.5 }));
  munn.position.set(L * 0.485, -H * 0.06, 0); munn.rotation.set(0, Math.PI / 2, Math.PI); kropp.add(munn);
  // Glitter for legendarisk fisk
  if (o.glitter) {
    const pg = new THREE.BufferGeometry(), n = 40, pos = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) { pos[i * 3] = rnd(-L * 0.6, L * 0.6); pos[i * 3 + 1] = rnd(-H, H); pos[i * 3 + 2] = rnd(-W, W); }
    pg.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const st = tekstur(lerret(64, 64, (x) => { const gr = x.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, 'rgba(255,255,220,1)'); gr.addColorStop(0.25, 'rgba(255,230,120,.8)'); gr.addColorStop(1, 'rgba(255,200,0,0)'); x.fillStyle = gr; x.fillRect(0, 0, 64, 64); }));
    const pts = new THREE.Points(pg, new THREE.PointsMaterial({ size: 0.35, map: st, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending })); g.add(pts); g.userData.glitter = pts;
  }
  g.userData.anim = (t) => { hale.rotation.y = Math.sin(t * 7 + (o.fase || 0)) * 0.45; kropp.rotation.y = Math.sin(t * 7 + (o.fase || 0) + 1.2) * 0.07; sider.forEach((s, i) => s.rotation.x = Math.sin(t * 5 + i) * 0.35);
    if (g.userData.glitter) g.userData.glitter.material.opacity = 0.6 + 0.4 * Math.sin(t * 6); };
  return g;
}
function lagFiskScene() {
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(C(0x1b8cc0), 0.035);
  scene.background = C(0x1b8cc0);
  // Undervannslys: lys ovenfra og «lysstråler»
  scene.add(new THREE.HemisphereLight(C(0xbff0ff), C(0x0a3a5a), 1.0));
  const sol = new THREE.DirectionalLight(C(0xffffff), 1.8); sol.position.set(3, 10, 4); sol.castShadow = true; sol.shadow.mapSize.set(1024, 1024); scene.add(sol);
  const raa = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, uniforms: { tid: { value: 0 } },
    vertexShader: 'varying vec2 vU; void main(){ vU = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: 'uniform float tid; varying vec2 vU; void main(){ float s = pow(max(0.0, sin(vU.x*22.0 + tid*0.6) * sin(vU.x*9.0 - tid*0.4)), 3.0); gl_FragColor = vec4(vec3(0.6,0.9,1.0), s * 0.22 * vU.y); }' });
  const straaler = new THREE.Mesh(new THREE.PlaneGeometry(30, 16), raa); straaler.position.set(0, 4, -6); straaler.rotation.z = 0.25; scene.add(straaler);
  // Sandbunn med tang og steiner
  const sand = new THREE.Mesh(new THREE.PlaneGeometry(60, 60, 60, 60), new THREE.MeshStandardMaterial({ color: C(0xe8d3a0), roughness: 1 }));
  sand.rotation.x = -Math.PI / 2; sand.position.y = -2.4; sand.receiveShadow = true;
  { const p = sand.geometry.attributes.position; for (let i = 0; i < p.count; i++) p.setZ(i, (fbm(p.getX(i) * 0.25, p.getY(i) * 0.25) - 0.5) * 0.8); sand.geometry.computeVertexNormals(); }
  scene.add(sand);
  const tang = new THREE.MeshStandardMaterial({ color: C(0x2f9e4f), roughness: 0.6, side: THREE.DoubleSide });
  const tangListe = [];

  // Steiner i strandkanten
  const stein = new THREE.MeshStandardMaterial({ color: C(0x8e98a2), roughness: 0.9, flatShading: true });
  for (let i = 0; i < 16; i++) { const v = rnd(0, Math.PI * 2), d = rnd(R - 2, R + 4); const geo2 = new THREE.IcosahedronGeometry(rnd(0.7, 1.8), 1); const q = geo2.attributes.position; for (let j = 0; j < q.count; j++) q.setXYZ(j, q.getX(j) * rnd(0.8, 1.2), q.getY(j) * rnd(0.55, 0.85), q.getZ(j) * rnd(0.8, 1.2)); geo2.computeVertexNormals(); const m = new THREE.Mesh(geo2, stein); m.position.set(Math.cos(v) * d, 0.3, Math.sin(v) * d); m.castShadow = m.receiveShadow = true; scene.add(m); }
  // Brygga med planker og påler
  const plank = new THREE.MeshStandardMaterial({ map: treTekstur('#c9955c', 'rgba(60,30,10,.7)'), roughness: 0.8 }), paal = new THREE.MeshStandardMaterial({ color: C(0x6b4a2a), roughness: 0.9 });
  for (let i = 0; i < 26; i++) { const m = new THREE.Mesh(new THREE.BoxGeometry(6, 0.18, 0.9), plank); m.position.set(rnd(-0.06, 0.06), 2.4, R - 3 + i * 1.0); m.rotation.y = rnd(-0.015, 0.015); m.castShadow = m.receiveShadow = true; scene.add(m); }
  for (let i = 0; i < 6; i++) for (const s of [-1, 1]) { const m = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.32, 4.4, 10), paal); m.position.set(s * 2.9, 0.4, R + i * 4.6); m.castShadow = true; scene.add(m); }
  // Fyrtårn med glans
  const fyr = new THREE.Group(); fyr.position.set(12, 3.6, -16); scene.add(fyr);
  for (let i = 0; i < 5; i++) { const m = new THREE.Mesh(new THREE.CylinderGeometry(2.45 - i * 0.25, 2.7 - i * 0.25, 3.2, 28), new THREE.MeshPhysicalMaterial({ color: C(i % 2 ? 0xffffff : 0xe5483f), roughness: 0.4, clearcoat: 0.6 })); m.position.y = 1.6 + i * 3.2; m.castShadow = true; fyr.add(m); }
  const lys = new THREE.Mesh(new THREE.SphereGeometry(1.2, 20, 14), new THREE.MeshBasicMaterial({ color: C(0xfff3a8) })); lys.position.y = 17.3; fyr.add(lys);
  const tak = new THREE.Mesh(new THREE.ConeGeometry(2.4, 2, 28), new THREE.MeshPhysicalMaterial({ color: C(0xe5483f), roughness: 0.35, clearcoat: 0.8 })); tak.position.y = 19.3; tak.castShadow = true; fyr.add(tak);
  return { scene, mal: new THREE.Vector3(0, 3, 4), avstand: 95, hoyde: 34, vinkel: 0.3, vann,
    tekst: '🌊 Hav og øy: glans fra sola, skum, myk strand, nye palmer og brygge', foer: 'na-oy.webp',
    oppdater(t) { vann.material.uniforms.tid.value = t; vann.material.uniforms.kamera.value.copy(camera.position); lys.material.color.setHSL(0.14, 1, 0.75 + 0.15 * Math.sin(t * 3)); } };
}

// ======================================================
//  Visning: velg scene, dra for å se rundt, bytt mellom før og etter
// ======================================================
const scener = { fisk: lagFiskScene(), baat: lagBaatScene(), hav: lagOyScene() };
let aktiv = 'fisk', visFoer = false;
const merke = document.getElementById('merke'), foer = document.getElementById('foer'), bytt = document.getElementById('bytt');
function velg(navn) {
  aktiv = navn; const s = scener[navn]; s.vinkelNaa = s.vinkel; s.hoydeNaa = s.hoyde;
  document.querySelectorAll('#topp button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.scene === navn)));
  foer.style.backgroundImage = `url(${s.foer})`; settFoer(false);
}
function settFoer(v) {
  visFoer = v; foer.classList.toggle('vis', v);
  const s = scener[aktiv];
  merke.innerHTML = v ? 'NÅ: slik er det i spillet i dag<small>Trykk «Se ny grafikk» for å sammenligne</small>' : `NY: ${s.tekst}<small>Dra for å se rundt</small>`;
  bytt.textContent = v ? '✨ Se ny grafikk' : '👀 Se hvordan det er nå';
}
document.querySelectorAll('#topp button').forEach(b => b.addEventListener('click', () => velg(b.dataset.scene)));
bytt.addEventListener('click', () => settFoer(!visFoer));
// Dra for å rotere
let drar = null;
canvas.addEventListener('pointerdown', e => { drar = { x: e.clientX, y: e.clientY }; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => { if (!drar) return; const s = scener[aktiv]; s.vinkelNaa -= (e.clientX - drar.x) * 0.006; s.hoydeNaa = Math.max(s.hoyde * 0.2, Math.min(s.hoyde * 2.2, s.hoydeNaa + (e.clientY - drar.y) * 0.03 * s.avstand / 10)); drar = { x: e.clientX, y: e.clientY }; });
canvas.addEventListener('pointerup', () => drar = null); canvas.addEventListener('pointercancel', () => drar = null);
velg('fisk');
const klokke = new THREE.Clock();
function loop() {
  requestAnimationFrame(loop);
  if (visFoer) return;
  const t = klokke.getElapsedTime(), s = scener[aktiv];
  if (!drar) s.vinkelNaa += 0.0015;
  camera.position.set(s.mal.x + Math.sin(s.vinkelNaa) * s.avstand, s.mal.y + s.hoydeNaa, s.mal.z + Math.cos(s.vinkelNaa) * s.avstand);
  camera.lookAt(s.mal);
  s.oppdater(t);
  renderer.render(s.scene, camera);
}
loop();
window.__test = { velg, scener, renderer };
</script>
