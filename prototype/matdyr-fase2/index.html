<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' blob: data:; object-src 'none'; base-uri 'none'">
<link rel="icon" href="data:,">
<title>Matdyr-regn – nye matdyr og gården (prototype)</title>
<style>
  :root { --gull:#ffd23f; --mork:rgba(29,36,64,.86); }
  html,body { margin:0; height:100%; overflow:hidden; background:#a8d8f0; font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; color:#fff; }
  canvas { display:block; touch-action:none; }
  #scene { position:fixed; inset:0; }
  #scene.ramme { inset:auto; left:50%; top:50%; transform:translate(-50%,-50%); width:390px; height:min(844px,calc(100vh - 20px)); border:10px solid #1d2440; border-radius:36px; overflow:hidden; box-shadow:0 10px 40px rgba(0,0,0,.4); }
  .topp { position:fixed; top:calc(10px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%); display:flex; gap:8px; z-index:5; }
  button { font:inherit; font-weight:800; color:#fff; background:var(--mork); border:2px solid rgba(255,255,255,.3); border-radius:14px; min-height:44px; min-width:44px; padding:6px 12px; cursor:pointer; }
  button[aria-pressed="true"] { background:linear-gradient(#ffd75e,#f0a91c); color:#3a2300; border-color:#fff; }
  button:focus-visible { outline:3px solid #fff; outline-offset:2px; }
  .panel { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(10px + env(safe-area-inset-bottom)); z-index:5; display:flex; flex-direction:column; gap:8px; align-items:center; max-width:calc(100vw - 16px); }
  .rad { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; }
  .kort { position:fixed; top:calc(64px + env(safe-area-inset-top)); left:calc(10px + env(safe-area-inset-left)); z-index:5; background:var(--mork); border:2px solid rgba(255,255,255,.25); border-radius:16px; padding:10px 14px; max-width:min(320px,calc(100vw - 20px)); font-size:15px; line-height:1.35; }
  .kort h1 { margin:0 0 4px; font-size:22px; }
  .sj { font-weight:900; }
  .rute { margin-top:6px; padding:6px 8px; background:rgba(255,255,255,.12); border-radius:10px; font-size:13px; line-height:1.45; }
  .liten { font-size:13px; opacity:.85; }
  #maal { position:fixed; right:calc(10px + env(safe-area-inset-right)); top:calc(64px + env(safe-area-inset-top)); z-index:5; background:rgba(0,0,0,.45); border-radius:10px; padding:4px 8px; font:12px ui-monospace,monospace; }
  @media (max-width:640px) { .kort { top:calc(64px + env(safe-area-inset-top)); font-size:13px; padding:8px 10px; max-width:calc(100vw - 20px); } .kort h1 { font-size:18px; } .kort .liten, .kort .rute { display:none; } #maal { top:auto; bottom:4px; right:4px; font-size:10px; } button { padding:4px 8px; font-size:14px; min-height:44px; } .rad { gap:4px; } }
  #joy, #hopp { display:none; }
  body.spiller #joy { display:block; position:fixed; left:calc(18px + env(safe-area-inset-left)); bottom:calc(84px + env(safe-area-inset-bottom)); width:140px; height:140px; border-radius:50%; background:rgba(255,255,255,.22); border:3px solid rgba(255,255,255,.6); z-index:6; touch-action:none; }
  #knott { position:absolute; left:45px; top:45px; width:50px; height:50px; border-radius:50%; background:var(--gull); box-shadow:0 2px 8px rgba(0,0,0,.3); }
  body.spiller #hopp { display:flex; flex-direction:column; align-items:center; justify-content:center; position:fixed; right:calc(18px + env(safe-area-inset-right)); bottom:calc(84px + env(safe-area-inset-bottom)); width:96px; height:96px; border-radius:50%; font-size:34px; line-height:1; background:linear-gradient(#ffd75e,#f0a91c); color:#3a2300; border:3px solid #fff; z-index:6; touch-action:none; }
  #hopp span { font-size:14px; }
  @media (max-width:640px) { body.spiller .panel { top:calc(150px + env(safe-area-inset-top)); bottom:auto; } body.spiller .panel .rad { flex-wrap:nowrap; } body.spiller #maal { display:none; } }
  @media (pointer:fine) { body.spiller #joy, body.spiller #hopp { display:none; } }
  #handling { display:none; }
  body.spiller #handling:not([hidden]) { display:block; position:fixed; right:calc(14px + env(safe-area-inset-right)); bottom:calc(192px + env(safe-area-inset-bottom)); max-width:min(58vw,300px); z-index:6; font-size:16px; text-align:left; background:linear-gradient(#5fd068,#2e9e3c); border-color:#fff; }
  body.spiller #handling.lav { background:var(--mork); opacity:.92; }
  @media (pointer:fine) { body.spiller #handling:not([hidden]) { right:calc(18px + env(safe-area-inset-right)); bottom:calc(84px + env(safe-area-inset-bottom)); } }
  #melding { position:fixed; left:50%; transform:translateX(-50%); top:calc(64px + env(safe-area-inset-top)); z-index:7; background:rgba(20,26,48,.92); border:2px solid var(--gull); border-radius:14px; padding:8px 14px; max-width:min(520px,calc(100vw - 24px)); font-weight:700; text-align:center; }
  @media (max-width:640px) { #melding { top:auto; bottom:calc(240px + env(safe-area-inset-bottom)); font-size:14px; } }
  .hud { font-size:20px; } .hud2 { font-size:14px; margin:2px 0 4px; } .liten2 { font-size:14px; color:#9ef0a6; font-weight:800; }
  .rad.test button { font-size:13px; min-height:40px; }
  #dialog { position:fixed; inset:0; z-index:20; background:rgba(10,14,30,.55); display:flex; align-items:center; justify-content:center; padding:12px; }
  #dialog[hidden] { display:none; }
  #dialogInnhold { background:#1d2440; border:2px solid rgba(255,255,255,.35); border-radius:18px; padding:14px 16px; width:min(560px,100%); max-height:calc(100vh - 40px); overflow:auto; }
  #dialogInnhold h2 { margin:0 0 6px; font-size:22px; } #dialogInnhold p { margin:6px 0; }
  .krav { background:rgba(255,255,255,.08); border-radius:12px; padding:8px 10px; margin:8px 0; border:2px solid transparent; } .krav.ok { border-color:#5fd068; }
  .kravtopp { display:flex; justify-content:space-between; gap:8px; font-weight:800; }
  .sjb { display:inline-block; border-radius:8px; padding:0 6px; color:#10131f; font-size:12px; font-weight:900; margin:0 2px; }
  .brikker { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; } .brikke { font-size:14px; min-height:44px; padding:4px 10px; } .brikke:disabled { opacity:.45; }
  .knapper { display:flex; gap:8px; justify-content:flex-end; margin-top:10px; flex-wrap:wrap; }
  button.hoved { background:linear-gradient(#5fd068,#2e9e3c); } button.hoved:disabled { opacity:.45; background:var(--mork); } button.fare { background:#c0392b; }
  .del { background:rgba(255,255,255,.08); border-radius:12px; padding:8px 10px; margin:8px 0; } .del ul { margin:4px 0 0; padding-left:20px; }
  .status { color:#ffd23f; font-weight:800; }
  .hint { color:#ffe58a; font-weight:700; font-size:14px; margin:6px 0 0; }
  #grafikk { position:fixed; top:calc(64px + env(safe-area-inset-top)); right:10px; z-index:21; background:#1d2440; border:2px solid rgba(255,255,255,.35); border-radius:16px; padding:10px 14px; width:min(420px,calc(100vw - 20px)); }
  #grafikk h2 { margin:0 0 6px; font-size:18px; } #grafikk[hidden] { display:none; }
  #tmEtikett { position:fixed; left:0; right:0; top:50%; display:flex; justify-content:space-around; z-index:4; pointer-events:none; font-weight:900; font-size:20px; text-shadow:0 2px 6px rgba(0,0,0,.6); }
  #tmEtikett::after { content:''; position:fixed; left:50%; top:0; bottom:0; width:2px; background:rgba(255,255,255,.8); }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
  /* Matdyrboka (fordeling C) */
  .bokhode { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; } .bokhode select { font-size:16px; min-height:44px; border-radius:10px; padding:4px 8px; }
  .bokrad { margin:10px 0 4px; display:flex; align-items:center; gap:8px; font-weight:800; } .bokrad .merke { color:#ffe58a; }
  .bokruter { display:grid; grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:6px; }
  .bokrute { border:3px solid rgba(255,255,255,.18); border-radius:12px; padding:6px 4px; text-align:center; background:rgba(255,255,255,.06); min-height:78px; }
  .bokrute .emo { font-size:26px; display:block; } .bokrute .bn { font-size:12px; font-weight:700; display:block; line-height:1.15; }
  .bokrute.ukjent { opacity:.6; border-style:dashed; } .bokrute.ukjent .emo { filter:grayscale(1) brightness(.6); }
  .bokrute.gud { background:linear-gradient(160deg,rgba(255,215,64,.35),rgba(255,160,0,.15)); box-shadow:0 0 10px rgba(255,200,40,.6); }
  .bokrute.hemmelig { background:linear-gradient(160deg,rgba(120,60,220,.45),rgba(20,10,60,.6)); box-shadow:0 0 10px rgba(180,110,255,.6); }
  .bokrute.skjult { background:#0c0f1e; } .arvmerke { display:block; font-size:11px; color:#ffd6a0; margin-top:2px; }
  .kall { background:rgba(255,215,64,.12); border:2px solid rgba(255,215,64,.5); border-radius:12px; padding:8px 10px; margin:8px 0; }
</style>
</head>
<body>
<div id="scene"></div>
<nav class="topp" aria-label="Velg visning">
  <button type="button" id="fMatdyr" aria-pressed="true">🐮 Matdyr</button>
  <button type="button" id="fGard" aria-pressed="false">🏡 Gården</button>
  <button type="button" id="fSpill" aria-pressed="false">🎮 Spill</button>
  <button type="button" id="fGrafikk" aria-label="Grafikk og ytelse" title="Grafikk og ytelse">⚙️</button>
</nav>
<div class="kort" id="kort" aria-live="polite"></div>
<div id="maal" aria-hidden="true"></div>
<div class="panel" id="panel"></div>
<div id="joy" aria-hidden="true"><div id="knott"></div></div>
<button type="button" id="hopp" aria-label="Hopp">⤒<span>Hopp</span></button>
<button type="button" id="handling" hidden></button>
<div id="melding" role="status" aria-live="polite" hidden></div>
<div id="dialog" hidden><div id="dialogInnhold" role="dialog" aria-modal="true"></div></div>

<script src="three-r128.min.js"></script>
<script src="gltfloader-r128.js"></script>
<script src="helt-robot.js"></script>
<script src="figurer.js"></script>
<script src="matdyrdata.js"></script>
<script src="miljo.js"></script>
<script src="visning.js"></script>
<script src="spillkjerne.js"></script>
</body>
</html>
