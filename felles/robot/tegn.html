<!DOCTYPE html>
<html lang="no"><head><meta charset="utf-8"><title>EVN-roboten – bildeverksted</title>
<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }</script>
<script src="./ecoins-tilbehor.js"></script><!-- kopi av ecoins/tilbehor-3d.js på grenen ecoins/v1 -->
</head><body style="margin:0;background:#888">
<script type="module">
// Tegner bilder av EVN-roboten (RobotExpressive, CC0) med samme gulfarge som Mørkeskogen 2.0.
// Brukes av lag-bilder.mjs. Ingen nettverkskall utenfor denne mappa.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { ROBOT } from './robot-oppsett.js';
import { lagTilbehor } from './tilbehor.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = ROBOT.lys.eksponering;
renderer.setClearColor(0x000000, 0);

const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a7a66, ROBOT.lys.himmel));
const sol = new THREE.DirectionalLight(0xffffff, ROBOT.lys.sol);
sol.position.set(-3, 6, 5);
scene.add(sol);
const fyll = new THREE.DirectionalLight(0xdfe8ff, ROBOT.lys.fyll);
fyll.position.set(4, 2, 3);
scene.add(fyll);

const gltf = await new GLTFLoader().loadAsync('./helt-robot.glb');
const modell = gltf.scene, rot = new THREE.Group();
rot.add(modell); scene.add(rot);
// Hovedfargen (materialet «Main») = EVN-gul. Grått og svart er som i originalen.
const hoved = new Set();
modell.traverse(o => { if (o.isMesh && o.material && o.material.name === 'Main') hoved.add(o.material); });
for (const m of hoved) m.color.setHex(ROBOT.farge);           // sRGB-hex; three.js regner om til lineær
const box = new THREE.Box3().setFromObject(modell);
const H = box.max.y - box.min.y;
modell.position.y = -box.min.y;                                // føttene på y = 0
const mix = new THREE.AnimationMixer(modell), klipp = {};
for (const a of gltf.animations) klipp[a.name] = a;

function stilling(navn, t) {
  mix.stopAllAction();
  const a = mix.clipAction(klipp[navn]); a.reset().play();
  mix.setTime(Math.min(t, klipp[navn].duration - 1e-4));
  modell.updateMatrixWorld(true);
}

// Ortografisk kamera, hevet «hoyde» grader. Bakkepunktet under roboten havner «fot» fra toppen av bildet.
function ortoKamera(hoyde, synlig, fot) {
  const c = new THREE.OrthographicCamera(-synlig / 2, synlig / 2, fot * synlig, -(1 - fot) * synlig, -100, 100);
  const v = THREE.MathUtils.degToRad(hoyde);
  c.position.set(0, Math.sin(v) * 10, Math.cos(v) * 10); c.lookAt(0, 0, 0);
  return c;
}
function perspKamera(hoyde, avstand, mal, fov = 30) {
  const c = new THREE.PerspectiveCamera(fov, 1, 0.1, 100);
  const v = THREE.MathUtils.degToRad(hoyde);
  c.position.set(Math.sin(ROBOT.web.sving) * avstand * Math.cos(v), mal + Math.sin(v) * avstand, Math.cos(ROBOT.web.sving) * avstand * Math.cos(v));
  c.lookAt(0, mal, 0); return c;
}

// Ekstra ting som festes for ett ark eller bilde, og fjernes etterpå
let ekstra = [];
function fjernEkstra() { for (const o of ekstra) o.parent && o.parent.remove(o); ekstra = []; }
// Egg (Magiske egg): lilla med gull-prikker og svak glød
function lagEgg(skala) {
  const g = new THREE.Group();
  const egg = new THREE.Mesh(new THREE.SphereGeometry(1, 20, 14), new THREE.MeshStandardMaterial({ color: 0xb06cff, emissive: 0x5a1fa0, emissiveIntensity: .45, roughness: .45 }));
  egg.scale.set(.8, 1.05, .8); g.add(egg);
  for (const [a, b] of [[0, .4], [1.3, -.1], [2.5, .3], [3.6, -.35], [4.8, .15], [5.7, -.5]]) {
    const p = new THREE.Mesh(new THREE.SphereGeometry(.13, 8, 6), new THREE.MeshStandardMaterial({ color: 0xffd54a, emissive: 0x8a6400, emissiveIntensity: .6 }));
    p.position.set(Math.cos(a) * .78 * Math.sqrt(1 - b * b), b * 1.03, Math.sin(a) * .78 * Math.sqrt(1 - b * b)); g.add(p);
  }
  g.scale.setScalar(skala); return g;
}
function leggTilEkstra(spec) {
  stilling('Idle', 0); rot.rotation.y = 0; rot.updateMatrixWorld(true);
  if (spec.tilbehor) ekstra.push(...lagTilbehor(THREE, scene, modell, spec.tilbehor.epoke, spec.tilbehor.hva || 'begge'));
  if (spec.vare) {                                        // E-coins-vare: bare denne vises; alle festede deler fjernes etterpå
    const t = window.EVNTilbehor.lag(THREE, modell);
    const v = t.objekt(spec.vare); if (!v) throw new Error('ukjent vare ' + spec.vare);
    modell.traverse(o => { if (o.name && o.name.startsWith('evn-tilbehor-')) ekstra.push(o); });
    for (const o of ekstra) o.visible = (o === v);
  }
  if (spec.rekvisitt === 'egg-hand') {                    // egget i høyre hånd (følger animasjonen)
    let h = null; modell.traverse(o => { if (o.isBone && o.name.replace(/[^a-z0-9]/gi, '') === 'Palm2R') h = o; });
    const e = lagEgg(H * .085); const ws = new THREE.Vector3(); h.getWorldScale(ws); e.scale.divideScalar(ws.x);
    e.position.set(0, H * .07 / ws.x, 0); h.add(e); ekstra.push(e);
  }
  if (spec.rekvisitt === 'egg-bakke') {                   // egget står på bakken foran roboten
    const e = lagEgg(H * .13); e.position.set(H * .36, H * .135, H * .3); scene.add(e); ekstra.push(e);
  }
}

// spec: { F, kol, rammer:[{klipp,t,retning(rad),speil,juster}], hoyde, synlig (× robothøyde), fot, format, kvalitet,
//         tilbehor:{epoke,hva}, kunTilbehor }
// juster: 'topp' flytter bildet loddrett så toppen av roboten står der toppen står i første bilde (hopp og klatring står stille i høyden).
// kunTilbehor: tegner bare tilbehøret; roboten skjuler det som er bak den, men tegnes ikke (laget legges over robotarket i spillet).
window.tegnArk = (spec) => {
  fjernEkstra(); leggTilEkstra(spec);
  const skjult = [];
  if (spec.kunTilbehor) modell.traverse(o => { if (o.isMesh && !ekstra.some(e => { let p = o; while (p) { if (p === e) return true; p = p.parent; } return false; })) { if (!skjult.some(([m]) => m === o.material)) skjult.push([o.material, o.material.colorWrite]); o.material.colorWrite = false; } });
  const F = spec.F, kol = spec.kol || spec.rammer.length, rader = Math.ceil(spec.rammer.length / kol);
  renderer.setSize(F, F, false);
  const E = spec.ekstraTopp || 0, FH = F + E;            // ekstraTopp: plass over rammen til høye hatter (bare tilbehørslag)
  const ark = document.createElement('canvas'); ark.width = F * kol; ark.height = FH * rader;
  const c2 = ark.getContext('2d');
  const kam = ortoKamera(spec.hoyde, spec.synlig * H, spec.fot);
  const tmp = document.createElement('canvas'); tmp.width = tmp.height = F; const t2 = tmp.getContext('2d', { willReadFrequently: true });
  const topp = () => { const d = t2.getImageData(0, 0, F, F).data; for (let y = 0; y < F; y++) for (let x = 0; x < F; x++) if (d[(y * F + x) * 4 + 3] > 8) return y; return 0; };
  const bunn = () => { const d = t2.getImageData(0, 0, F, F).data; for (let y = F - 1; y >= 0; y--) for (let x = 0; x < F; x++) if (d[(y * F + x) * 4 + 3] > 8) return y; return F - 1; };
  let refTopp = null;
  spec.rammer.forEach((r, i) => {
    stilling(r.klipp, r.t); rot.rotation.y = r.retning || 0;
    let dy = 0;
    if (spec.kunTilbehor && (i === 0 || r.juster)) {     // mål på roboten uten tilbehør, så laget flyttes likt med robotarket
      const sv = ekstra.map(o => [o, o.visible]); ekstra.forEach(o => { o.visible = false; });
      for (const [m] of skjult) m.colorWrite = true;
      renderer.render(scene, kam); t2.clearRect(0, 0, F, F); t2.drawImage(renderer.domElement, 0, 0);
      if (i === 0) refTopp = topp();
      if (r.juster === 'topp') { dy = refTopp - topp(); dy = Math.min(dy, F - 1 - bunn()); }
      for (const [m] of skjult) m.colorWrite = false; sv.forEach(([o, v]) => { o.visible = v; });
    }
    // Tilbehørslaget: flytt kameraet i stedet for bildet, så en hatt over rammekanten ikke blir kuttet
    const enhet = (kam.top - kam.bottom) / F;
    const flytt = spec.kunTilbehor && dy ? dy * enhet : 0;
    if (flytt || E) { kam.top += flytt + E * enhet; kam.bottom += flytt; kam.updateProjectionMatrix(); if (E) { renderer.setSize(F, FH, false); tmp.height = FH; } }
    renderer.render(scene, kam);
    if (flytt || E) { kam.top -= flytt + E * enhet; kam.bottom -= flytt; kam.updateProjectionMatrix(); }
    t2.clearRect(0, 0, F, FH); t2.drawImage(renderer.domElement, 0, 0);
    if (E) { renderer.setSize(F, F, false); }
    if (spec.kunTilbehor) dy = 0;
    if (!spec.kunTilbehor) {
      if (i === 0) refTopp = topp();
      if (r.juster === 'topp') { dy = refTopp - topp(); dy = Math.min(dy, F - 1 - bunn()); }
    }
    const x = (i % kol) * F, y = Math.floor(i / kol) * FH;
    c2.save();
    if (r.speil) { c2.translate(x + F, y + dy); c2.scale(-1, 1); c2.drawImage(tmp, 0, 0); }
    else c2.drawImage(tmp, x, y + dy);
    c2.restore();
  });
  for (const [m, v] of skjult) m.colorWrite = v;
  fjernEkstra();
  return ark.toDataURL(spec.format || 'image/webp', spec.kvalitet ?? 0.82);
};

// Enkeltbilde med perspektiv (nettsiden). spec: { B, Hpx, klipp, t, retning, hoyde, avstand, mal, beskj: [x,y,b,h] i andel }
window.tegnBilde = (spec) => {
  fjernEkstra(); leggTilEkstra(spec);
  renderer.setSize(spec.B, spec.Hpx, false);
  stilling(spec.klipp, spec.t); rot.rotation.y = spec.retning || 0;
  const kam = perspKamera(spec.hoyde, spec.avstand * H, spec.mal * H, spec.fov || 30);
  kam.aspect = spec.B / spec.Hpx; kam.updateProjectionMatrix();
  renderer.render(scene, kam);
  fjernEkstra();
  return renderer.domElement.toDataURL('image/png');
};
window.klippNavn = Object.fromEntries(Object.entries(klipp).map(([k, a]) => [k, +a.duration.toFixed(3)]));
window.robotHoyde = H;
window.klar = true;
</script></body></html>
