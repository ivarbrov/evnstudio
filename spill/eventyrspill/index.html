<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<link rel="manifest" href="manifest.json">

<link rel="apple-touch-icon" href="ikoner/apple-touch-icon.png">
<meta name="theme-color" content="#141a2a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
  html, body { margin: 0; height: 100%; background: #10180f; overflow: hidden; font-family: system-ui, sans-serif; }
  canvas { display: block; width: 100%; height: 100%; cursor: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #baseKnapp { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); padding: 10px 16px; font-size: 16px; font-weight: bold;
    background: #6b4a2b; color: #ffe9b0; border: 3px solid #3d2a17; border-radius: 10px; cursor: pointer; display: none; }
  #baseKnapp:hover { background: #7d5833; transform: translateX(-50%); }
  #base { position: fixed; inset: 0; display: none; background: rgba(15,10,5,0.88); color: #fff; overflow: auto; }
  #base .innhold { max-width: 900px; margin: 30px auto; padding: 0 20px 110px; }
  #base h1 { color: #ffd54a; margin: 0 0 4px; font-size: 34px; }
  #base .info { color: #ddd; margin-bottom: 18px; font-size: 17px; }
  #base .kort-liste { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .kort { background: linear-gradient(#4a3520, #2e2013); border: 3px solid #6b4a2b; border-radius: 14px; padding: 14px; }
  .kort.last { opacity: 0.55; filter: grayscale(0.7); }
  .kort .ikon { font-size: 40px; }
  .kort h3 { margin: 4px 0; color: #ffe9b0; }
  .kort p { margin: 4px 0 10px; color: #ccc; font-size: 14px; min-height: 36px; }
  .kort .niva { color: #7fd4ff; font-size: 14px; margin-bottom: 8px; }
  .kort button { width: 100%; padding: 9px; font-size: 15px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer;
    background: #ffc107; color: #3d2a17; }
  .kort button:disabled { background: #666; color: #bbb; cursor: default; }
  @media (max-width: 600px) {
    #base .innhold { margin: 14px auto; padding: 0 10px 100px; }
    #base h1 { font-size: 24px; }
    #base .info { font-size: 14px; margin-bottom: 10px; }
    #base .kort-liste { grid-template-columns: 1fr 1fr; gap: 8px; }
    .kort { padding: 8px; border-width: 2px; }
    .kort .ikon { font-size: 26px; }
    .kort h3 { font-size: 15px; margin: 2px 0; }
    .kort p { font-size: 11px; min-height: 0; margin: 2px 0 6px; }
    .kort .niva { font-size: 11px; margin-bottom: 6px; }
    .kort button { font-size: 13px; padding: 8px 4px; }
  }
  #nyttSpillKnapp { margin-top: 24px; padding: 8px 14px; font-size: 13px; border-radius: 8px; border: 2px solid #7a2a2a;
    background: transparent; color: #ff8a80; cursor: pointer; }
  #tilbake { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); width: min(420px, calc(100% - 32px));
    padding: 16px 22px; font-size: 20px; font-weight: bold; border-radius: 14px; border: 3px solid #1f3f80;
    background: #3a6fd8; color: #fff; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,0.6); z-index: 10; }
</style>
</head>
<body>
<canvas id="spill"></canvas>
<button id="baseKnapp">🏰 Basen (B)</button>
<div id="base"><div class="innhold">
  <h1>🏰 Basen din</h1>
  <div class="info" id="baseInfo"></div>
  <div class="kort-liste" id="kortListe"></div>
  <button id="nyttSpillKnapp">🗑️ Start helt på nytt</button>
  <button id="tilbake">⚔️ Tilbake til kampen (B)</button>
</div></div>
<script>
// ===================== INNSTILLINGER (prøv å endre tallene!) =====================
const START_FART = 3;         // hvor fort helten løper i starten
const START_SVERD_SKADE = 2;  // hvor mye sverdet skader i starten
const START_MAGI_SKADE = 2;   // hvor mye magien skader i starten
const MAGI_KOSTER = 20;       // hvor mye mana én magikule koster
const VERDEN_BREDDE = 1800;
const VERDEN_HOYDE = 1300;
function murMaks() { return 100 * antallBygget('mur'); } // muren tåler 100 per nivå
const TARN_MAKS = 30;         // hvor mye hvert vakttårn tåler
const PORTAL_BOLGE = 10;      // etter denne bølgen åpner portalen til romstasjonen seg
const BOSS_HVER = 5;          // en boss kommer hver 5. bølge

// ===================== TING DU KAN BYGGE I BASEN =====================
// laasesOpp = hvilket nivå du må ha for å kunne bygge den
const BYGNINGER = [
  { id: 'smie',    ikon: '⚒️', navn: 'Smie',          tekst: 'Sterkere sverd: +1 sverdskade',          laasesOpp: 1, priser: [20, 40, 70, 110, 160, 220, 290, 370, 460, 560] },
  { id: 'bronn',   ikon: '⛲', navn: 'Livsbrønn',     tekst: 'Mer liv: +3 maks liv',                    laasesOpp: 1, priser: [15, 30, 55, 85, 120, 160, 210, 270, 340, 420] },
  { id: 'mur',     ikon: '🧱', navn: 'Steinmur',      tekst: 'Mur rundt basen. Fiendene må slå den ned for å komme inn. +100 murliv per nivå', laasesOpp: 1, priser: [50, 120, 250, 400] },
  { id: 'vakttarn',ikon: '🏹', navn: 'Vakttårn',      tekst: 'Tårn som skyter piler på fiender. Ett nytt tårn for hver oppgradering', laasesOpp: 2, priser: [40, 70, 110, 160] },
  { id: 'reparer', ikon: '🔧', navn: 'Reparer',       tekst: 'Fiks muren og tårnene etter at en boss har knust dem', laasesOpp: 1, priser: [25], kanKjopesMange: true },
  { id: 'alkymist',ikon: '🧪', navn: 'Alkymist',      tekst: 'Kjøp en livsdrikk. Trykk Q for å drikke (+6 liv)', laasesOpp: 2, priser: [15], kanKjopesMange: true },
  { id: 'magitarn',ikon: '🔮', navn: 'Magitårn',      tekst: 'Sterkere magi: +1 magiskade og +20 mana', laasesOpp: 2, priser: [30, 60, 100, 150, 210, 280, 360, 450, 550, 660] },
  { id: 'skomaker',ikon: '👢', navn: 'Skomaker',      tekst: 'Raskere støvler: helten løper fortere',   laasesOpp: 3, priser: [40, 90, 150] },
  { id: 'trippel', ikon: '✨', navn: 'Trippelmagi',   tekst: 'Magien skyter 3 kuler samtidig!',         laasesOpp: 5, priser: [150] },
  { id: 'pilskade',ikon: '🎯', navn: 'Skarpere piler', tekst: 'Vakttårnene gjør +1 skade per oppgradering', laasesOpp: 8, priser: [100, 200, 300, 400, 500] },
  { id: 'kanon',   ikon: '💣', navn: 'Kanontårn',     tekst: 'Stor kanon i basen som skyter eksploderende kuler', laasesOpp: 1, kreverVerden: 4, priser: [200, 350, 500] },
  { id: 'tempel',  ikon: '🏛️', navn: 'Helbredelsestempel', tekst: 'Helten får litt liv tilbake hele tiden',   laasesOpp: 15, priser: [250, 450] },
  { id: 'drage',   ikon: '🐉', navn: 'Kjæledrage',    tekst: 'En drage som følger deg og sprer ild på fiender!', laasesOpp: 20, priser: [400, 700, 1000] },
  { id: 'lyn',     ikon: '⚡', navn: 'Lynstorm',      tekst: 'Lynet slår ned i de 3 nærmeste fiendene hvert 4. sekund', laasesOpp: 25, priser: [600, 900] },
  // Bare på piratskipet (verden 4)
  { id: 'skattekiste', ikon: '💎', navn: 'Skattekiste', tekst: 'Fiendene slipper 50 % flere penger', laasesOpp: 1, kreverVerden: 4, priser: [300] },
  // Bare på romstasjonen (verden 5)
  { id: 'pistol',  ikon: '🔫', navn: 'Piratpistol',   tekst: 'Din egen pistol! Skyt med F eller høyreklikk. Sterkere for hver oppgradering', laasesOpp: 1, kreverVerden: 4, priser: [80, 160, 260] },
  { id: 'laserpistol', ikon: '💥', navn: 'Laserpistol', tekst: 'Bygger om piratpistolen til laser: skyter raskere, sterkere og rett gjennom fiender', laasesOpp: 1, kreverVerden: 5, kreverBygg: 'pistol', priser: [300, 500] },
  { id: 'laser',   ikon: '📡', navn: 'Laserkanoner',  tekst: 'Vakttårnene skyter laser – mye mer skade!', laasesOpp: 1, kreverVerden: 5, priser: [120] },
  { id: 'skjold',  ikon: '🛡️', navn: 'Energiskjold',  tekst: 'Helten tar 1 mindre skade per slag',        laasesOpp: 1, kreverVerden: 5, priser: [80, 160] },
  // Pynt – havner et tilfeldig sted i basen
  { id: 'blomster',ikon: '🌷', navn: 'Blomsterbed',   tekst: 'Pynt: fine blomster i basen',  laasesOpp: 1, priser: [5],  kanKjopesMange: true, pynt: true },
  { id: 'fakkel',  ikon: '🔥', navn: 'Fakkel',        tekst: 'Pynt: en fakkel som lyser',    laasesOpp: 1, priser: [8],  kanKjopesMange: true, pynt: true },
  { id: 'flagg',   ikon: '🚩', navn: 'Flagg',         tekst: 'Pynt: et flagg som vaier',     laasesOpp: 2, priser: [10], kanKjopesMange: true, pynt: true },
  { id: 'statue',  ikon: '🗿', navn: 'Statue',        tekst: 'Pynt: en statue av helten!',   laasesOpp: 3, priser: [25], kanKjopesMange: true, pynt: true }
];

// Hvor byggene står i basen (i forhold til midten av basen)
const BASE_X = VERDEN_BREDDE / 2, BASE_Y = VERDEN_HOYDE / 2, BASE_RADIUS = 270;
const BYGGEPLASS = {
  smie:     { x: -170, y: -80 },
  bronn:    { x: -60,  y: -170 },
  alkymist: { x: 170,  y: -80 },
  magitarn: { x: -110, y: 150 },
  skomaker: { x: 110,  y: 150 },
  trippel:  { x: 70,   y: -170 },
  kanon:    { x: -195, y: 40 },
  tempel:   { x: 195,  y: 40 }
};

// Hvor vakttårnene står på muren (vinkler rundt basen)
const TARN_VINKLER = [Math.PI * 0.25, Math.PI * 0.75, Math.PI * 1.25, Math.PI * 1.75];
function tarnPlass(i) {
  return { x: BASE_X + Math.cos(TARN_VINKLER[i]) * BASE_RADIUS, y: BASE_Y + Math.sin(TARN_VINKLER[i]) * BASE_RADIUS * 0.92 };
}

// ===================== OPPSETT =====================
const canvas = document.getElementById('spill');
const ctx = canvas.getContext('2d');
let zoom = 1; // på små skjermer zoomer vi litt ut så du ser mer
function tilpassStorrelse() {
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  zoom = Math.max(0.6, Math.min(1, Math.min(canvas.width, canvas.height) / 600));
}
window.addEventListener('resize', tilpassStorrelse);
tilpassStorrelse();

const taster = {};
let tilstand = 'start'; // start, spill, base, slutt
let mus = { x: 0, y: 0, brukt: false }; // hvor musepila er
let piler = [];
let helt, fiender, kuler, mynter, tekster, partikler, traer, bolge, kamera, tid, risting, bakke;
const bakker = {}; // ferdig tegnet bakke for hver verden
let kanonkuler = [], lyn = [];
// ===================== VERDENENE (tidsepoker) =====================
// Rekkefølgen følger tiden: portalen er en tidsmaskin
const VERDENER = [null,
  { navn: 'Steinalderen 🦴', ikon: '🦴', fiender: ['huleboer', 'sabeltann', 'trex'], bossTekst: '⚠️ T-rex kommer! 🦖',
    bakke: 'stein', hinder: 'stein', base: ['rgba(140,110,70,0.9)', 'rgba(120,95,60,0.75)'], vignett: 'rgba(25,12,0,0.5)', naer: 'kølle', avstand: 'slynge' },
  { navn: 'Oldtiden 🏛️', ikon: '🏛️', fiender: ['mumie', 'gladiator', 'farao'], bossTekst: '⚠️ Faraoen kommer! 👑',
    bakke: 'orken', hinder: 'soyle', base: ['rgba(200,180,140,0.95)', 'rgba(180,160,120,0.85)'], vignett: 'rgba(40,20,0,0.45)', naer: 'spyd', avstand: 'bue' },
  { navn: 'Monsterskogen 🌲', ikon: '🌲', fiender: ['skjelett', 'troll', 'trollkonge'], bossTekst: '⚠️ Trollkongen kommer! 👑',
    bakke: 'skog', hinder: 'tre', base: ['rgba(150,115,70,0.9)', 'rgba(130,100,60,0.75)'], vignett: 'rgba(0,10,0,0.55)', naer: 'sverd', avstand: 'magi' },
  { navn: 'Piratskipet 🏴‍☠️', ikon: '🏴‍☠️', fiender: ['pirat', 'blekksprut', 'piratkaptein'], bossTekst: '⚠️ Piratkapteinen kommer! 🏴‍☠️',
    bakke: 'skip', hinder: 'tonne', base: ['rgba(140,95,55,0.95)', 'rgba(120,80,45,0.85)'], vignett: 'rgba(0,15,35,0.55)', naer: 'sverd', avstand: 'magi' },
  { navn: 'Romstasjonen 🚀', ikon: '🚀', fiender: ['robot', 'romvesen', 'robotkonge'], bossTekst: '⚠️ Robotkongen kommer! 🤖',
    bakke: 'rom', hinder: 'kasse', base: ['rgba(70,85,110,0.95)', 'rgba(55,68,90,0.85)'], vignett: 'rgba(0,0,25,0.65)', naer: 'sverd', avstand: 'magi' }
];
const SISTE_VERDEN = VERDENER.length - 1;
const VERDENSNAVN = VERDENER.map(v => v ? v.navn : '');
const VERDENSIKON = VERDENER.map(v => v ? v.ikon : '');
const VAAPENNAVN = { 'kølle': 'kølle', spyd: 'spyd', sverd: 'sverd', slynge: 'slynge', bue: 'pil og bue', magi: 'magi' };
const VAAPENIKON = { 'kølle': '🪵', spyd: '🔱', sverd: '⚔️', slynge: '🪨', bue: '🏹', magi: '🔮' };
function epoke() { return VERDENER[helt.verden]; }
const PORTAL = { x: BASE_X, y: BASE_Y - 70 };

// Lager bakken én gang per verden, så den ser fin ut
function lagBakke(verden) {
  if (bakker[verden]) { bakke = bakker[verden]; return; }
  bakke = document.createElement('canvas');
  bakke.width = VERDEN_BREDDE; bakke.height = VERDEN_HOYDE;
  bakker[verden] = bakke;
  const b = bakke.getContext('2d');
  const type = VERDENER[verden].bakke;
  if (type === 'skip') { lagSkipBakke(b); return; }
  if (type === 'rom') { lagRomBakke(b); return; }
  if (type === 'orken') { lagOrkenBakke(b); return; }
  const stein = type === 'stein';
  b.fillStyle = stein ? '#7a7a3a' : '#3b6b2e'; b.fillRect(0, 0, VERDEN_BREDDE, VERDEN_HOYDE);
  // gressflekker i ulike grønnfarger (gulere i steinalderen)
  const gronn = stein ? ['#86803f', '#6f6a33', '#8f8a48', '#5f6b2e', '#99914f'] : ['#3f7232', '#36622a', '#447a36', '#325c27', '#4a8239'];
  for (let i = 0; i < 2500; i++) {
    b.fillStyle = gronn[i % gronn.length];
    b.globalAlpha = 0.5;
    b.beginPath();
    b.ellipse(Math.random() * VERDEN_BREDDE, Math.random() * VERDEN_HOYDE, 10 + Math.random() * 40, 6 + Math.random() * 20, Math.random() * 3, 0, Math.PI * 2);
    b.fill();
  }
  b.globalAlpha = 1;
  // jordsti
  b.strokeStyle = '#7a5c3a'; b.lineWidth = 46; b.lineCap = 'round'; b.globalAlpha = 0.75;
  b.beginPath(); b.moveTo(0, 700);
  b.bezierCurveTo(500, 500, 1100, 900, 1800, 600); b.stroke();
  b.beginPath(); b.moveTo(900, 0); b.bezierCurveTo(800, 400, 1000, 900, 850, 1300); b.stroke();
  b.globalAlpha = 1;
  // gresstrå
  for (let i = 0; i < 4000; i++) {
    const x = Math.random() * VERDEN_BREDDE, y = Math.random() * VERDEN_HOYDE;
    b.strokeStyle = Math.random() < 0.5 ? '#5a9447' : '#2d5422'; b.lineWidth = 1.5;
    b.beginPath(); b.moveTo(x, y); b.lineTo(x + Math.random() * 4 - 2, y - 5 - Math.random() * 5); b.stroke();
  }
  // blomster
  const blomsterFarger = ['#ffe066', '#ff8fab', '#ffffff', '#a0c4ff'];
  for (let i = 0; i < 260; i++) {
    const x = Math.random() * VERDEN_BREDDE, y = Math.random() * VERDEN_HOYDE;
    b.fillStyle = blomsterFarger[i % 4];
    for (let k = 0; k < 4; k++) { b.beginPath(); b.arc(x + Math.cos(k * 1.57) * 2.5, y + Math.sin(k * 1.57) * 2.5, 2, 0, 7); b.fill(); }
    b.fillStyle = '#e09f3e'; b.beginPath(); b.arc(x, y, 1.5, 0, 7); b.fill();
  }
  // bein som ligger strødd (bare i steinalderen)
  if (stein) for (let i = 0; i < 40; i++) {
    const x = Math.random() * VERDEN_BREDDE, y = Math.random() * VERDEN_HOYDE, v = Math.random() * 3;
    b.save(); b.translate(x, y); b.rotate(v);
    b.fillStyle = '#efe6d0'; b.fillRect(-8, -2, 16, 4);
    for (const sx of [-8, 8]) { b.beginPath(); b.arc(sx, -2, 3, 0, 7); b.arc(sx, 2, 3, 0, 7); b.fill(); }
    b.restore();
  }
  // steiner
  for (let i = 0; i < (stein ? 140 : 60); i++) {
    const x = Math.random() * VERDEN_BREDDE, y = Math.random() * VERDEN_HOYDE, r = 5 + Math.random() * 10;
    b.fillStyle = 'rgba(0,0,0,0.25)'; b.beginPath(); b.ellipse(x + 3, y + 3, r, r * 0.7, 0, 0, 7); b.fill();
    const g = b.createRadialGradient(x - r / 3, y - r / 3, 1, x, y, r);
    g.addColorStop(0, '#b5b5b5'); g.addColorStop(1, '#6d6d6d');
    b.fillStyle = g; b.beginPath(); b.ellipse(x, y, r, r * 0.7, 0, 0, 7); b.fill();
  }
}

// Ørkenen i oldtiden: sand, sanddyner og en brolagt vei
function lagOrkenBakke(b) {
  b.fillStyle = '#d9b77a'; b.fillRect(0, 0, VERDEN_BREDDE, VERDEN_HOYDE);
  for (let i = 0; i < 1500; i++) {
    b.fillStyle = ['#e2c38a', '#cfa968', '#e8cc96', '#c79f5e'][i % 4]; b.globalAlpha = 0.45;
    b.beginPath(); b.ellipse(Math.random() * VERDEN_BREDDE, Math.random() * VERDEN_HOYDE, 20 + Math.random() * 60, 6 + Math.random() * 14, -0.2, 0, Math.PI * 2); b.fill();
  }
  b.globalAlpha = 1;
  // brolagte veier
  b.lineCap = 'round';
  for (const [farge, bredde] of [['#9e8a68', 54], ['#b8a37c', 44]]) {
    b.strokeStyle = farge; b.lineWidth = bredde;
    b.beginPath(); b.moveTo(0, 700); b.bezierCurveTo(500, 500, 1100, 900, 1800, 600); b.stroke();
    b.beginPath(); b.moveTo(900, 0); b.bezierCurveTo(800, 400, 1000, 900, 850, 1300); b.stroke();
  }
  // små palmer langt unna og steinbiter
  for (let i = 0; i < 90; i++) {
    const x = Math.random() * VERDEN_BREDDE, y = Math.random() * VERDEN_HOYDE, r = 3 + Math.random() * 6;
    b.fillStyle = 'rgba(0,0,0,0.15)'; b.beginPath(); b.ellipse(x + 2, y + 2, r, r * 0.6, 0, 0, 7); b.fill();
    b.fillStyle = '#c2a575'; b.beginPath(); b.ellipse(x, y, r, r * 0.6, 0, 0, 7); b.fill();
  }
  for (let i = 0; i < 18; i++) {
    const x = Math.random() * VERDEN_BREDDE, y = Math.random() * VERDEN_HOYDE;
    b.strokeStyle = '#2e7d32'; b.lineWidth = 3;
    for (let k = 0; k < 6; k++) { const v = k * 1.05; b.beginPath(); b.moveTo(x, y); b.quadraticCurveTo(x + Math.cos(v) * 10, y + Math.sin(v) * 10 - 4, x + Math.cos(v) * 18, y + Math.sin(v) * 18); b.stroke(); }
    b.fillStyle = '#6d4c2f'; b.beginPath(); b.arc(x, y, 3, 0, 7); b.fill();
  }
}

// Dekket på piratskipet: treplanker, spiker og tau
function lagSkipBakke(b) {
  b.fillStyle = '#5a3d22'; b.fillRect(0, 0, VERDEN_BREDDE, VERDEN_HOYDE);
  for (let rad = 0, y = 0; y < VERDEN_HOYDE; rad++, y += 28) {
    b.fillStyle = rad % 2 ? '#7a5634' : '#714f30'; b.fillRect(0, y, VERDEN_BREDDE, 26);
    b.fillStyle = 'rgba(255,255,255,0.04)'; b.fillRect(0, y, VERDEN_BREDDE, 4);
    for (let x = (rad * 137) % 240; x < VERDEN_BREDDE; x += 240) {
      b.fillStyle = '#3e2a16'; b.fillRect(x, y, 3, 26);
      b.fillStyle = '#2b1d0f'; b.fillRect(x + 6, y + 5, 3, 3); b.fillRect(x + 6, y + 18, 3, 3);
    }
  }
  // tauruller
  for (let i = 0; i < 25; i++) {
    const x = Math.random() * VERDEN_BREDDE, y = Math.random() * VERDEN_HOYDE;
    b.strokeStyle = '#c9a66b'; b.lineWidth = 3;
    for (let r = 4; r < 18; r += 4) { b.beginPath(); b.arc(x, y, r, 0, 7); b.stroke(); }
  }
  // rekkverk rundt hele skipet
  b.strokeStyle = '#3e2a16'; b.lineWidth = 24; b.strokeRect(12, 12, VERDEN_BREDDE - 24, VERDEN_HOYDE - 24);
  b.strokeStyle = '#8d6238'; b.lineWidth = 6; b.strokeRect(12, 12, VERDEN_BREDDE - 24, VERDEN_HOYDE - 24);
}

// Gulvet på romstasjonen: metallplater, lysstriper og korridorer
function lagRomBakke(b) {
  b.fillStyle = '#1b2130'; b.fillRect(0, 0, VERDEN_BREDDE, VERDEN_HOYDE);
  for (let x = 0; x < VERDEN_BREDDE; x += 60) for (let y = 0; y < VERDEN_HOYDE; y += 60) {
    b.fillStyle = Math.random() < 0.15 ? '#252d40' : '#20283a'; b.fillRect(x + 2, y + 2, 56, 56);
    b.fillStyle = '#323c52'; b.fillRect(x + 6, y + 6, 3, 3); b.fillRect(x + 51, y + 6, 3, 3); b.fillRect(x + 6, y + 51, 3, 3); b.fillRect(x + 51, y + 51, 3, 3);
  }
  b.lineCap = 'round';
  for (const [farge, bredde] of [['#2c3a55', 70], ['#3f5378', 46]]) {
    b.strokeStyle = farge; b.lineWidth = bredde;
    b.beginPath(); b.moveTo(0, 700); b.bezierCurveTo(500, 500, 1100, 900, 1800, 600); b.stroke();
    b.beginPath(); b.moveTo(900, 0); b.bezierCurveTo(800, 400, 1000, 900, 850, 1300); b.stroke();
  }
  b.setLineDash([14, 18]); b.strokeStyle = 'rgba(0,229,255,0.7)'; b.lineWidth = 3;
  b.beginPath(); b.moveTo(0, 700); b.bezierCurveTo(500, 500, 1100, 900, 1800, 600); b.stroke();
  b.beginPath(); b.moveTo(900, 0); b.bezierCurveTo(800, 400, 1000, 900, 850, 1300); b.stroke();
  b.setLineDash([]);
  for (let i = 0; i < 120; i++) {
    const x = Math.random() * VERDEN_BREDDE, y = Math.random() * VERDEN_HOYDE;
    const farge = ['#00e5ff', '#ff4081', '#76ff03'][i % 3];
    const g = b.createRadialGradient(x, y, 0, x, y, 8); g.addColorStop(0, farge); g.addColorStop(1, 'rgba(0,0,0,0)');
    b.fillStyle = g; b.beginPath(); b.arc(x, y, 8, 0, 7); b.fill();
  }
}

function nyttSpill() {
  const gammel = helt; // det du hadde før du døde
  helt = {
    x: VERDEN_BREDDE / 2, y: VERDEN_HOYDE / 2, r: 16,
    liv: 10, maksLiv: 10, mana: 100, maksMana: 100,
    fart: START_FART, sverdSkade: START_SVERD_SKADE, magiSkade: START_MAGI_SKADE,
    penger: 0, xp: 0, niva: 1, drikker: 0,
    bygget: {},           // hvor mange ganger hver bygning er bygget/oppgradert
    pynt: [],             // pynt som står i basen
    tarnNedkjoling: [0, 0, 0, 0],
    murLiv: 0, tarnLiv: [0, 0, 0, 0],   // hvor hel muren og tårnene er
    verden: 1, portalApen: false, sjekkpunkt: 0, alleKlart: false,
    dragePos: { x: VERDEN_BREDDE / 2 - 40, y: VERDEN_HOYDE / 2 }, drageNed: 0, drageFlamme: 0, drageMaal: null,
    kanonNed: 0, kanonVinkel: 0, lynNed: 0, tempelNed: 0,
    retning: { x: 1, y: 0 }, gaaTid: 0,
    sverdTid: 0, sverdNedkjoling: 0, magiNedkjoling: 0, skadetTid: 0, pistolNed: 0
  };
  // Ta med pengene, drikkene og alt du har bygget fra forrige gang
  if (gammel) {
    helt.niva = gammel.niva;
    helt.xp = gammel.xp;
    helt.maksLiv += (helt.niva - 1) * 2; helt.liv = helt.maksLiv;
    helt.maksMana += (helt.niva - 1) * 10; helt.mana = helt.maksMana;
    helt.penger = gammel.penger;
    helt.drikker = gammel.drikker;
    helt.pynt = gammel.pynt;
    helt.verden = gammel.verden;
    helt.portalApen = gammel.portalApen;
    helt.sjekkpunkt = gammel.sjekkpunkt;
    helt.alleKlart = gammel.alleKlart;
    helt.murLiv = gammel.murLiv;
    helt.tarnLiv = gammel.tarnLiv.slice();
    for (const id in gammel.bygget) {
      for (let i = 0; i < gammel.bygget[id]; i++) brukBygning(id);
      helt.bygget[id] = gammel.bygget[id];
    }
  }
  fiender = []; kuler = []; mynter = []; tekster = []; partikler = []; piler = []; kanonkuler = []; lyn = [];
  bolge = 0; tid = 0; risting = 0;
  kamera = { x: 0, y: 0 };
  traer = [];
  let frø = 7;
  function tilfeldig() { frø = (frø * 9301 + 49297) % 233280; return frø / 233280; }
  for (let i = 0; i < 45; i++) {
    const t = { x: 60 + tilfeldig() * (VERDEN_BREDDE - 120), y: 60 + tilfeldig() * (VERDEN_HOYDE - 120), r: 24 + tilfeldig() * 18, form: tilfeldig() };
    if (Math.hypot(t.x - BASE_X, t.y - BASE_Y) > BASE_RADIUS + 50) traer.push(t);
  }
  lagBakke(helt.verden);
  bolge = helt.sjekkpunkt; // start fra siste sjekkpunkt
  nyBolge();
}

function xpTilNesteNiva() { return helt.niva * 30; }

const PARTIKKELFARGE = { skjelett: '#eee8d5', troll: '#5d8a3a', trollkonge: '#5d8a3a', robot: '#b0bec5', romvesen: '#b388ff', robotkonge: '#ffd54a', huleboer: '#8d6e63', sabeltann: '#ff9800', trex: '#558b2f', mumie: '#efe6d0', gladiator: '#ffb300', farao: '#ffd54a', pirat: '#ef5350', blekksprut: '#ff8a65', piratkaptein: '#ffd54a' };

function lagFiende(type) {
  const t = FIENDETYPER[type];
  let x, y;
  do {
    x = 40 + Math.random() * (VERDEN_BREDDE - 80);
    y = 40 + Math.random() * (VERDEN_HOYDE - 80);
  } while (Math.hypot(x - helt.x, y - helt.y) < 400 || Math.hypot(x - BASE_X, y - BASE_Y) < BASE_RADIUS + 60);
  // Fiendene blir sterkere for hver bølge – og dobbelt så sterke på romstasjonen
  const skala = 1 + 0.10 * (bolge - 1);
  const vf = 1 + 0.6 * (helt.verden - 1); // fiendene blir sterkere for hver epoke
  const liv = Math.round(t.liv * skala * vf);
  fiender.push({ type, x, y, r: t.r, liv, maksLiv: liv, fart: t.fart,
                 skade: t.skade + Math.floor((bolge - 1) / 5) + Math.floor((helt.verden - 1) / 2),
                 penger: Math.round(t.penger * (1 + 0.1 * (bolge - 1)) * vf * (antallBygget('skattekiste') ? 1.5 : 1)),
                 xp: Math.round(t.xp * (1 + 0.1 * (bolge - 1)) * vf),
                 boss: !!t.boss, knuseTid: 0, slagTid: 0, blink: 0, gaaTid: Math.random() * 100 });
}

// ===================== LAGRING =====================
// Spillet lagres i nettleseren, så du kan fortsette der du slapp
const LAGRE_NOKKEL = 'evn-eventyrspill-v1';
function lagre() {
  if (!helt) return;
  try {
    const d = {};
    for (const k of ['niva', 'xp', 'penger', 'drikker', 'pynt', 'bygget', 'verden', 'portalApen', 'sjekkpunkt', 'alleKlart', 'murLiv', 'tarnLiv']) d[k] = helt[k];
    localStorage.setItem(LAGRE_NOKKEL, JSON.stringify(d));
  } catch (e) { /* lagring er ikke tilgjengelig – spillet virker likevel */ }
}
function hentLagring() {
  try {
    const t = localStorage.getItem(LAGRE_NOKKEL);
    if (!t) return null;
    const d = JSON.parse(t);
    if (!d || typeof d.bygget !== 'object') return null;
    const standard = { niva: 1, xp: 0, penger: 0, drikker: 0, pynt: [], bygget: {}, verden: 1, portalApen: false, sjekkpunkt: 0, alleKlart: false, murLiv: 0, tarnLiv: [0, 0, 0, 0] };
    const h = Object.assign(standard, d);
    if (!VERDENER[h.verden]) h.verden = 1;
    return h;
  } catch (e) { return null; }
}
function slettLagring() { try { localStorage.removeItem(LAGRE_NOKKEL); } catch (e) {} }

function nyBolge() {
  bolge++;
  const [liten, stor, boss] = epoke().fiender;
  const antallSmaa = Math.min(40, 2 + bolge * 2);   // maks 40 små
  const antallStore = Math.min(15, Math.floor(bolge / 2)); // maks 15 store
  for (let i = 0; i < antallSmaa; i++) lagFiende(liten);
  for (let i = 0; i < antallStore; i++) lagFiende(stor);
  visTekst('Bølge ' + bolge + '!', helt.x, helt.y - 50, '#ffd54a', 28);
  // fullt liv ved starten av hver bølge
  if (bolge > 1 && helt.liv < helt.maksLiv) { helt.liv = helt.maksLiv; visTekst('❤️ Fullt liv!', helt.x, helt.y + 40, '#7dff8a', 18); }
  if (bolge % BOSS_HVER === 0) {
    // sjekkpunkt før bossen: dør du, prøver du bossen på nytt
    if (bolge - 1 > helt.sjekkpunkt) helt.sjekkpunkt = bolge - 1;
    lagFiende(boss);
    visTekst(epoke().bossTekst, helt.x, helt.y - 85, '#ff5252', 26);
  }
}

function visTekst(tekst, x, y, farge, storrelse) {
  tekster.push({ tekst, x, y, farge, storrelse: storrelse || 16, tid: 60 });
}

function lagPartikler(x, y, farge, antall, fart) {
  for (let i = 0; i < antall; i++) {
    const v = Math.random() * Math.PI * 2, f = Math.random() * (fart || 4);
    partikler.push({ x, y, vx: Math.cos(v) * f, vy: Math.sin(v) * f, liv: 25 + Math.random() * 20, farge, r: 2 + Math.random() * 3 });
  }
}

// ===================== BASEN =====================
function antallBygget(id) { return helt.bygget[id] || 0; }

function apneBase() {
  if (tilstand !== 'spill') return;
  tilstand = 'base';
  visBase();
  document.getElementById('base').style.display = 'block';
}
function lukkBase() {
  tilstand = 'spill';
  document.getElementById('base').style.display = 'none';
  for (const k in taster) taster[k] = false;
}

function visBase() {
  document.getElementById('baseInfo').textContent =
    '💰 ' + helt.penger + ' penger   ⭐ Nivå ' + helt.niva + '   ❤️ ' + helt.liv + '/' + helt.maksLiv + '   🧪 ' + helt.drikker + ' drikker';
  const liste = document.getElementById('kortListe');
  liste.innerHTML = '';
  for (const b of BYGNINGER) {
    const antall = antallBygget(b.id);
    const mangler = b.kreverBygg && !antallBygget(b.kreverBygg);
    const last = helt.niva < b.laasesOpp || (b.kreverVerden && helt.verden < b.kreverVerden) || mangler;
    const ferdig = !b.kanKjopesMange && antall >= b.priser.length;
    const pris = b.kanKjopesMange ? b.priser[0] : b.priser[antall];
    const kort = document.createElement('div');
    kort.className = 'kort' + (last ? ' last' : '');
    let nivaTekst = b.id === 'reparer' ? (antallBygget('mur') ? '🧱 Mur ' + helt.murLiv + '/' + murMaks() : 'Du har ingen mur ennå')
                  : b.pynt ? 'Du har ' + antall + ' i basen'
                  : b.kanKjopesMange ? 'Du har ' + helt.drikker + ' drikker'
                  : b.priser.length === 1 ? (antall ? 'Bygget ✅' : 'Ikke bygget')
                  : 'Nivå ' + antall + ' av ' + b.priser.length;
    kort.innerHTML = '<div class="ikon">' + b.ikon + '</div><h3>' + b.navn + '</h3><p>' + b.tekst + '</p><div class="niva">' + nivaTekst + '</div>';
    const knapp = document.createElement('button');
    if (last) {
      knapp.textContent = b.kreverVerden && helt.verden < b.kreverVerden ? '🔒 Låses opp i ' + VERDENSNAVN[b.kreverVerden]
                        : mangler ? '🔒 Krever ' + BYGNINGER.find(x => x.id === b.kreverBygg).navn
                        : '🔒 Låses opp på nivå ' + b.laasesOpp;
      knapp.disabled = true;
    }
    else if (b.id === 'reparer' && !trengerReparasjon()) { knapp.textContent = 'Alt er helt ✅'; knapp.disabled = true; }
    else if (ferdig) { knapp.textContent = 'Ferdig oppgradert ⭐'; knapp.disabled = true; }
    else {
      knapp.textContent = (b.kanKjopesMange ? 'Kjøp' : antall === 0 ? 'Bygg' : 'Oppgrader') + ' – ' + pris + ' 💰';
      knapp.disabled = helt.penger < pris;
      knapp.onclick = () => bygg(b, pris);
    }
    kort.appendChild(knapp);
    liste.appendChild(kort);
  }
}

function bygg(b, pris) {
  if (helt.penger < pris) return;
  helt.penger -= pris;
  helt.bygget[b.id] = antallBygget(b.id) + 1;
  if (b.id === 'alkymist') helt.drikker += 1;
  else if (b.pynt) settUtPynt(b.id);
  else if (b.id === 'reparer') reparer();
  else brukBygning(b.id);
  if (b.id === 'mur') helt.murLiv = murMaks();
  if (b.id === 'vakttarn') helt.tarnLiv[antallBygget('vakttarn') - 1] = TARN_MAKS;
  visBase();
  lagre();
}

function trengerReparasjon() {
  if (antallBygget('mur') && helt.murLiv < murMaks()) return true;
  for (let i = 0; i < Math.min(antallBygget('vakttarn'), 4); i++) if (helt.tarnLiv[i] < TARN_MAKS) return true;
  return false;
}
function reparer() {
  if (antallBygget('mur')) helt.murLiv = murMaks();
  for (let i = 0; i < Math.min(antallBygget('vakttarn'), 4); i++) helt.tarnLiv[i] = TARN_MAKS;
}

// Finner en ledig plass i basen til pynten
function settUtPynt(type) {
  for (let forsok = 0; forsok < 200; forsok++) {
    const v = Math.random() * Math.PI * 2, a = 60 + Math.random() * (BASE_RADIUS - 95);
    const x = BASE_X + Math.cos(v) * a, y = BASE_Y + Math.sin(v) * a * 0.92;
    let ledig = Math.hypot(x - BASE_X, y - BASE_Y - 40) > 45;
    for (const id in BYGGEPLASS) if (Math.hypot(x - BASE_X - BYGGEPLASS[id].x, y - BASE_Y - BYGGEPLASS[id].y + 15) < 60) ledig = false;
    for (const p of helt.pynt) if (Math.hypot(x - p.x, y - p.y) < 28) ledig = false;
    if (ledig) { helt.pynt.push({ type, x, y }); return; }
  }
  helt.pynt.push({ type, x: BASE_X + Math.random() * 100 - 50, y: BASE_Y + 100 });
}

// Hva hver bygning gjør med helten
function brukBygning(id) {
  if (id === 'smie') helt.sverdSkade += 1;
  if (id === 'bronn') { helt.maksLiv += 3; helt.liv += 3; }
  if (id === 'magitarn') { helt.magiSkade += 1; helt.maksMana += 20; helt.mana += 20; }
  if (id === 'skomaker') helt.fart += 0.5;
}

document.getElementById('baseKnapp').onclick = apneBase;
document.getElementById('tilbake').onclick = lukkBase;

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault();
  if (tilstand === 'base') { if (k === 'b' || k === 'escape') lukkBase(); return; }

    if (k === ' ') sverdHugg();

    if (k === 'b') apneBase();
    if (k === 'q') drikk();
    if (k === 'f') skytPistol(helt.retning.x, helt.retning.y);
  } else if (k === 'enter' || k === ' ') {
    startSpill();
  }
});
window.addEventListener('keyup', e => { taster[e.key.toLowerCase()] = false; });
canvas.addEventListener('mousemove', e => { mus.x = e.clientX; mus.y = e.clientY; mus.brukt = true; });
canvas.addEventListener('mousedown', e => {

});
